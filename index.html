<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, getDoc, doc, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBycn2thYzf2H4YRe21cK7SBZPTWCZG8K4",
        authDomain: "k20-tony-blogger.firebaseapp.com",
        projectId: "k20-tony-blogger",
        storageBucket: "k20-tony-blogger.firebasestorage.app",
        messagingSenderId: "322587779924",
        appId: "1:322587779924:web:e3f3c0704902afa2551ec1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    
    window.AppState = { user: null, role: null, db: db, auth: auth, storage: storage, currentCategory: '全部', searchQuery: '', appId: 'tony-studio' };
    window.FS = { collection, getDocs, getDoc, doc, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, writeBatch };
    window.StorageAPI = { ref, uploadBytes, getDownloadURL };
    window.AuthAPI = { createUserWithEmailAndPassword, signInWithEmailAndPassword };

    window.currentNewsData = []; 
    window.userBookmarksCache = [];

    const initAuth = async () => {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } catch(e) {
                    await signInAnonymously(auth);
                }
            } else {
                await signInAnonymously(auth);
            }
        } catch (error) {
            console.error("Auth error", error);
        }
    };
    initAuth();

    window.getApiKey = () => {
        const key = localStorage.getItem('tony_gemini_api_key');
        return (key && key.trim() !== '') ? key.trim() : null;
    };
    
    window.saveApiKey = (key) => {
        if(key && key.trim() !== '') {
            localStorage.setItem('tony_gemini_api_key', key.trim());
            showToast('API 金鑰已儲存於本機', 'success');
        } else {
            showToast('請提供有效的 API 金鑰', 'warning');
        }
    };

    window.showApiKeyModal = () => {
        const existing = document.getElementById('apikey-modal');
        if (existing) existing.remove();
        const currentKey = window.getApiKey() || '';
        const modalHtml = `
            <div id="apikey-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 transition-opacity duration-300 backdrop-blur-sm">
                <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300 overflow-hidden">
                    <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 class="text-lg font-bold text-primary flex items-center gap-2"><i class="fa-solid fa-key text-accent"></i>設定 AI 系統金鑰</h3>
                        <button onclick="document.getElementById('apikey-modal').remove()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <div class="p-6 text-textMain text-sm leading-relaxed">
                        <p class="mb-4 text-gray-700 font-medium">為啟用智能新聞抓取與 AI 顧問功能，請輸入您的 Google Gemini API 金鑰。</p>
                        
                        <div class="mb-5 p-4 bg-blue-50/50 border border-blue-100 rounded-xl text-sm text-blue-800 shadow-inner">
                            <p class="font-bold mb-1 flex items-center gap-2"><i class="fa-solid fa-lightbulb text-accent"></i> 還沒有金鑰？</p>
                            <p>請前往 <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-cta font-bold hover:underline inline-flex items-center gap-1">Google AI Studio <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i></a> 免費申請一組金鑰 (API Key)。</p>
                        </div>

                        <input type="password" id="modal-apikey-input" placeholder="輸入 AIza... 開頭的 39 碼金鑰" value="${currentKey}" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-cta focus:ring-1 focus:ring-cta font-mono text-sm transition">
                        <p class="mt-3 text-xs text-gray-400"><i class="fa-solid fa-shield-halved mr-1"></i>金鑰將安全地儲存於您的瀏覽器本地端，不會外流。</p>
                    </div>
                    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                        <button onclick="document.getElementById('apikey-modal').remove()" class="px-5 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 transition text-sm font-bold">取消</button>
                        <button onclick="const k=document.getElementById('modal-apikey-input').value; if(k){window.saveApiKey(k); document.getElementById('apikey-modal').remove();}else{showToast('請輸入金鑰', 'warning');}" class="px-5 py-2.5 bg-cta hover:bg-blue-700 text-white rounded-lg transition text-sm font-bold shadow-md">儲存並啟用</button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        const modal = document.getElementById('apikey-modal');
        void modal.offsetWidth; 
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
    };

    window.callGeminiAPI = async (systemPrompt, userPrompt, useSearch = false, extraOptions = {}) => {
        const apiKey = window.getApiKey();
        if (!apiKey) {
            window.showApiKeyModal();
            throw new Error("MISSING_API_KEY");
        }
        
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${apiKey}`;
        
        const payload = {
            contents: [{ role: "user", parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { maxOutputTokens: 8192, ...(extraOptions.generationConfig || {}) }
        };

        if (useSearch) payload.tools = [{ "google_search": {} }];

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error?.message || `API Error: ${response.status}`);
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
        } catch (error) { throw error; }
    };

    window.updateSEO = (title, description = '', imageUrl = '') => {
        const baseTitle = 'TONY STUDIO';
        document.title = title === '個人品牌官網與專業內容中心' ? `${baseTitle} | ${title}` : (title ? `${title} | ${baseTitle}` : `${baseTitle} | 個人品牌官網與專業內容中心`);
    };

    window.showModal = (title, content, onConfirm = null, confirmText = '確認', isDanger = false) => {
        const existing = document.getElementById('custom-modal');
        if (existing) existing.remove();
        const modalHtml = `
            <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 transition-opacity duration-300">
                <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                        <h3 class="text-lg font-bold text-primary">${title}</h3>
                        <button onclick="document.getElementById('custom-modal').remove()" class="text-gray-400 hover:text-gray-700"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <div class="p-6 text-textMain text-sm leading-relaxed">${content}</div>
                    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-xl flex justify-end gap-3">
                        <button onclick="document.getElementById('custom-modal').remove()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 transition text-sm font-medium">取消</button>
                        ${onConfirm ? `<button id="modal-confirm-btn" class="px-4 py-2 ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-cta hover:bg-blue-700'} text-white rounded transition text-sm font-medium shadow-sm">${confirmText}</button>` : ''}
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        const modal = document.getElementById('custom-modal');
        void modal.offsetWidth; 
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
        if (onConfirm) document.getElementById('modal-confirm-btn').onclick = () => { onConfirm(); modal.remove(); };
    };

    window.handleLogout = async () => {
        try { 
            await signOut(auth); 
            window.AppState.role = null; 
            showToast("已成功登出", "success"); 
            window.location.hash = '#/'; 
        } 
        catch (error) { console.error("Logout failed", error); }
    };

    window.toggleMobileMenu = () => {
        const menu = document.getElementById('mobile-menu');
        const icon = document.getElementById('mobile-menu-icon');
        if (!menu || !icon) return;
        
        if (menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-xmark');
        } else {
            menu.classList.add('hidden');
            icon.classList.remove('fa-xmark');
            icon.classList.add('fa-bars');
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user && !user.isAnonymous) {
            try {
                const idTokenResult = await user.getIdTokenResult(true);
                window.AppState.role = idTokenResult.claims.role || 'member';
                if (user.email === 'mindnodeai@gmail.com') window.AppState.role = 'super_admin';
            } catch(e) {
                window.AppState.role = (user.email === 'mindnodeai@gmail.com') ? 'super_admin' : 'member';
            }
            window.AppState.user = user;
        } else {
            window.AppState.user = null; window.AppState.role = null;
        }
        updateNavbarAuthUI(window.AppState.user, window.AppState.role);
        
        // 若在文章頁面登入/登出，重新渲染留言表單
        const path = window.location.hash.slice(1);
        if (path.startsWith('/article/')) {
            const articleId = path.split('/')[2];
            if (window.renderCommentForm) window.renderCommentForm(articleId);
        }
    });

    function updateNavbarAuthUI(user, role) {
        const authContainer = document.getElementById('nav-auth-container');
        const mobileAuthContainer = document.getElementById('mobile-auth-container');
        if (!authContainer) return;

        if (user) {
            const displayName = user.displayName || user.email?.split('@')[0] || '會員';
            const avatarUrl = user.photoURL || ('https://placehold.co/100x100/163A63/FFF?text=' + displayName.charAt(0).toUpperCase());
            const adminLink = (role === 'super_admin' || role === 'admin') 
                ? `<a href="#/admin" class="text-xs font-bold text-accent bg-secondary px-2 py-1 rounded hover:bg-primary transition"><i class="fa-solid fa-gauge mr-1"></i>管理後台</a>` : '';

            authContainer.innerHTML = `
                <div class="flex items-center space-x-4">
                    ${adminLink}
                    <a href="#/member" class="flex items-center space-x-2 text-textSub hover:text-primary transition bg-gray-50 px-2 py-1.5 rounded-full border border-gray-100">
                        <img src="${avatarUrl}" alt="Avatar" class="w-7 h-7 rounded-full border border-gray-200">
                        <span class="text-sm font-medium hidden sm:block pr-2">${displayName}</span>
                    </a>
                    <button onclick="window.handleLogout()" class="text-sm text-gray-400 hover:text-red-600 transition" title="登出"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            `;
            if (mobileAuthContainer) mobileAuthContainer.innerHTML = `
                <div class="flex items-center space-x-3 px-3 py-3 bg-gray-50 rounded-lg mb-2">
                    <img src="${avatarUrl}" alt="Avatar" class="w-10 h-10 rounded-full border border-gray-200 shadow-sm">
                    <div>
                        <p class="text-sm font-bold text-textMain">${displayName}</p>
                        ${(role === 'super_admin' || role === 'admin') ? `<a href="#/admin" onclick="window.toggleMobileMenu()" class="text-xs font-bold text-accent"><i class="fa-solid fa-gauge"></i> 進入管理後台</a>` : ''}
                    </div>
                </div>
                <a href="#/member" onclick="window.toggleMobileMenu()" class="block px-3 py-3 rounded-md text-base font-medium text-textMain hover:bg-gray-50 transition border border-gray-100 mb-2 text-center bg-blue-50 text-cta">進入會員專區</a>
                <button onclick="window.toggleMobileMenu(); window.handleLogout();" class="w-full text-center block px-3 py-3 rounded-md text-base font-medium text-red-600 bg-red-50 hover:bg-red-100 transition shadow-sm">登出帳號</button>
            `;
        } else {
            authContainer.innerHTML = `<a href="#/login" class="px-5 py-2 text-sm font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>`;
            if (mobileAuthContainer) mobileAuthContainer.innerHTML = `<a href="#/login" onclick="window.toggleMobileMenu()" class="block w-full text-center px-5 py-3 text-base font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>`;
        }
    }
</script>

<div id="toast-container" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 z-[110] flex flex-col gap-2 pointer-events-none"></div>
<script>
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        let bgColor = 'bg-primary'; let icon = 'fa-info-circle';
        if (type === 'success') { bgColor = 'bg-green-600'; icon = 'fa-check-circle'; }
        else if (type === 'error') { bgColor = 'bg-red-600'; icon = 'fa-exclamation-circle'; }
        else if (type === 'warning') { bgColor = 'bg-accent'; icon = 'fa-exclamation-triangle'; }

        toast.className = `flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white ${bgColor} transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto`;
        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
        setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }
</script>

    window.restoreDailyNews = () => {
        const cachedJson = localStorage.getItem('tony_news_cache_json');
        const cachedTime = localStorage.getItem('tony_news_cache_time');
        const container = document.getElementById('daily-news-container');
        const dateDisplay = document.getElementById('daily-news-date');
        const btn = document.getElementById('btn-fetch-news');

        let shouldFetch = false;

        if (cachedJson && cachedTime && container) {
            try {
                window.currentNewsData = JSON.parse(cachedJson);
                window.renderNewsGrid(); 
                if(dateDisplay) dateDisplay.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> 暫存更新時間：${cachedTime}`;
                if(btn) btn.classList.add('animate-pulse', 'ring-4', 'ring-blue-500/30');

                const cacheDate = new Date(cachedTime);
                const now = new Date();
                const diffHours = Math.abs(now - cacheDate) / 36e5;
                if (diffHours > 12) shouldFetch = true;
            } catch (e) {
                shouldFetch = true;
            }
        } else {
            if(dateDisplay) dateDisplay.innerHTML = `<i class="fa-regular fa-calendar"></i> 今日日期：${new Date().toLocaleDateString('zh-TW')}`;
            if(btn) btn.classList.add('animate-pulse', 'ring-4', 'ring-blue-500/30');
            shouldFetch = true;
        }

        if (shouldFetch) {
            if(window.getApiKey()) {
               setTimeout(() => { if(window.fetchDailyNews) window.fetchDailyNews(); }, 800);
            } else {
                if(container) container.innerHTML = `
                    <div class="py-24 text-center text-textSub bg-gray-50 rounded-xl border border-dashed border-gray-300">
                        <i class="fa-solid fa-key text-5xl text-gray-300 mb-6"></i>
                        <p class="text-xl font-bold text-gray-400 mb-2">等待輸入金鑰</p>
                        <p class="text-sm text-gray-500">請在上方設定金鑰後，點擊更新按鈕取得新聞。</p>
                    </div>`;
            }
        }

        window.renderAllTimeTrending();
    };

    window.fetchDailyNews = async () => {
        const container = document.getElementById('daily-news-container');
        const btn = document.getElementById('btn-fetch-news');
        
        if (!window.getApiKey()) {
            window.showApiKeyModal();
            return;
        }

        if(btn) btn.classList.remove('animate-pulse', 'ring-4', 'ring-blue-500/30');
        if (!container) return;
        
        container.innerHTML = `
            <div class="py-24 text-center text-textSub bg-blue-50/50 rounded-xl border border-blue-100 shadow-inner">
                <i class="fa-solid fa-satellite-dish fa-beat text-5xl text-cta mb-6"></i>
                <p class="text-xl font-bold text-primary mb-2">AI 正在啟動全球聯網機制</p>
                <p class="text-sm text-gray-500">為您搜羅並深度分析今日最新情報... (約需 10-15 秒)</p>
            </div>
        `;
        
        try {
            const systemPrompt = "你是一位頂尖的國際科技與財經新聞總編。\n【嚴格輸出格式指示】\n你必須搜尋今日最新新聞，並精準輸出 8 則新聞 (6則全球重點, 2則台灣重點)。\n絕對不要使用 JSON 格式。請使用以下純文字格式，每一則新聞之間用 ===NEWS=== 分隔。\n\n範例格式：\nCATEGORY: 科技情報\nTITLE: 蘋果發表最新 AI 功能\nSUMMARY: 蘋果今日宣布全面整合 **Apple Intelligence**，預計將帶動 **50%** 的換機潮...\nURL: https://example.com/news1\n===NEWS===\nCATEGORY: 財經趨势\n...\n\n【內容規範】\n1. SUMMARY (摘要) 必須達 150 - 200 字，深入分析。\n2. 請務必在 SUMMARY 中，將專有名詞、企業名稱、重要數據用**雙星號**包裝起來。\n3. URL 必須是真實、可點擊的新聞網址。";

            const userPrompt = "請開始搜尋並輸出今日最新的 8 則 AI、財經與數位行銷新聞。";
            
            const extraOptions = {
                generationConfig: { maxOutputTokens: 8192 }
            };

            const textResponse = await window.callGeminiAPI(systemPrompt, userPrompt, true, extraOptions);
            
            if (!textResponse || textResponse.trim() === '') {
                throw new Error("AI 回傳了空白內容，請稍後重試。");
            }

            const newsData = [];
            const newsBlocks = textResponse.split('===NEWS===');
            
            for (const block of newsBlocks) {
                const lines = block.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                if (lines.length < 4) continue; 

                let category = '科技情報';
                let title = '未命名新聞';
                let summary = '';
                let url = '#';

                for (const line of lines) {
                    if (line.startsWith('CATEGORY:')) category = line.replace('CATEGORY:', '').trim();
                    else if (line.startsWith('TITLE:')) title = line.replace('TITLE:', '').trim();
                    else if (line.startsWith('URL:')) url = line.replace('URL:', '').trim();
                    else if (line.startsWith('SUMMARY:')) summary = line.replace('SUMMARY:', '').trim();
                    else if (summary !== '' && !line.startsWith('CATEGORY:') && !line.startsWith('TITLE:') && !line.startsWith('URL:')) {
                        summary += ' ' + line;
                    }
                }
                
                if (title !== '未命名新聞' && url !== '#') {
                    newsData.push({ category, title, summary, url });
                }
            }

            if (newsData.length === 0) {
                 throw new Error("無法從 AI 回應中解析出新聞資料。");
            }

            window.currentNewsData = newsData.slice(0, 8); 
            const timestamp = new Date().toLocaleString('zh-TW');
            localStorage.setItem('tony_news_cache_json', JSON.stringify(window.currentNewsData));
            localStorage.setItem('tony_news_cache_time', timestamp);
            
            document.getElementById('daily-news-date').innerHTML = `<i class="fa-regular fa-clock"></i> 最新更新：${timestamp}`;
            window.renderNewsGrid();
            window.renderAllTimeTrending(); 
            showToast("今日新聞情報彙整完畢！", "success");
            
        } catch (error) {
            console.error("新聞抓取失敗:", error);
            if (error.message.includes("MISSING_API_KEY")) return;
            container.innerHTML = `<div class="py-20 text-center text-red-500 bg-red-50 rounded-xl border border-red-100 shadow-inner">
                <i class="fa-solid fa-triangle-exclamation text-4xl mb-4"></i>
                <p class="font-bold text-lg">抓取失敗，請稍後重試。</p>
                <p class="text-sm text-red-400 mt-2">${error.message}</p>
                <div class="mt-4 p-4 bg-white/50 rounded text-left text-xs font-mono text-gray-600 max-w-2xl mx-auto overflow-auto border border-red-200">如果錯誤持續發生，請確認您的 API 金鑰額度，或嘗試重新整理頁面。</div>
            </div>`;
            showToast("新聞抓取失敗", "error");
        }
    };

    window.renderNewsGrid = async () => {
        const container = document.getElementById('daily-news-container');
        if (!container || !window.currentNewsData || window.currentNewsData.length === 0) return;

        let globalLikes = {};
        try {
            const likesRef = window.FS.collection(window.AppState.db, 'artifacts', window.AppState.appId, 'public', 'data', 'newsLikes');
            const snap = await window.FS.getDocs(likesRef);
            snap.forEach(doc => {
                globalLikes[doc.data().url] = doc.data().count;
            });
        } catch (e) {
            console.warn("無法取得全網熱門數據", e);
        }

        let likedUrls = [];
        try {
            likedUrls = JSON.parse(localStorage.getItem('tony_liked_news') || '[]');
        } catch(e) {}

        let finalHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-8">';
        
        window.currentNewsData.forEach((news, index) => {
            const likeCount = globalLikes[news.url] || 0;
            const hasLiked = likedUrls.includes(news.url);
            
            let safeSummary = (news.summary || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");
            safeSummary = safeSummary.replace(/\*\*(.*?)\*\*/g, '<strong class="bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded font-bold mx-0.5">$1</strong>');

            const iconClass = hasLiked ? "fa-solid fa-heart text-red-500" : "fa-regular fa-heart text-gray-400 group-hover:text-red-400";
            const btnClass = hasLiked ? "text-red-500 cursor-default" : "text-gray-400 hover:text-red-500 transition cursor-pointer";
            const clickEvent = hasLiked ? "" : `onclick="window.likeNews(${index})"`;

            finalHtml += `
            <div class="p-6 bg-white rounded-xl border border-gray-200 hover:shadow-xl hover:border-blue-200 transition flex flex-col h-full group">
                <div class="mb-5 flex items-center justify-between border-b border-gray-50 pb-4">
                    <span class="px-3 py-1 bg-blue-50 text-cta text-xs font-bold rounded-full border border-blue-100">${news.category || '科技情報'}</span>
                    <button id="btn-like-${index}" ${clickEvent} class="flex items-center gap-2 ${btnClass} px-3 py-1.5 rounded-full hover:bg-red-50 transition shadow-sm border border-transparent hover:border-red-100" title="推薦這則新聞">
                        <i class="${iconClass} text-xl"></i>
                        <span id="like-count-${index}" class="font-bold text-sm ${hasLiked ? 'text-red-500' : 'text-gray-500'}">${likeCount > 0 ? likeCount : '推薦'}</span>
                    </button>
                </div>
                <h3 class="text-xl font-bold text-primary mb-4 leading-snug group-hover:text-cta transition">${news.title}</h3>
                <p class="text-textSub mb-6 text-sm leading-relaxed flex-grow">
                    ${safeSummary}
                </p>
                <div class="mt-auto flex justify-between items-center bg-gray-50 px-4 py-3 rounded-lg border border-gray-100">
                    <span class="text-xs text-gray-400 font-medium"><i class="fa-regular fa-clock"></i> 今日最新</span>
                    <a href="${news.url}" target="_blank" class="text-cta hover:text-blue-800 font-bold text-sm inline-flex items-center gap-2"><i class="fa-solid fa-arrow-up-right-from-square"></i> 閱讀原文</a>
                </div>
            </div>`;
        });
        finalHtml += '</div>';
        container.innerHTML = finalHtml;
    };

    window.renderAllTimeTrending = async () => {
        const container = document.getElementById('all-time-trending-container');
        if(!container) return;
        try {
            const likesRef = window.FS.collection(window.AppState.db, 'artifacts', window.AppState.appId, 'public', 'data', 'newsLikes');
            const q = window.FS.query(likesRef, window.FS.orderBy("count", "desc"), window.FS.limit(5));
            const snap = await window.FS.getDocs(q);
            
            if(snap.empty) {
                container.innerHTML = '<p class="text-textSub text-center py-6 bg-white/50 rounded-xl border border-dashed border-orange-200">目前尚無熱門推薦，快去為喜歡的新聞按讚吧！</p>';
                return;
            }
            
            let html = '<div class="space-y-4">';
            let rank = 1;
            snap.forEach(doc => {
                const data = doc.data();
                let rankColor = rank === 1 ? 'text-yellow-500' : (rank === 2 ? 'text-gray-400' : (rank === 3 ? 'text-amber-600' : 'text-gray-300'));
                
                let safeSummary = (data.summary || '此為早期推薦新聞，暫無摘要紀錄。').replace(/</g, "&lt;").replace(/>/g, "&gt;");
                safeSummary = safeSummary.replace(/\*\*(.*?)\*\*/g, '<strong class="bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded font-bold mx-0.5">$1</strong>');

                html += `
                    <a href="${data.url}" target="_blank" class="block p-5 bg-white border border-orange-50 rounded-xl hover:shadow-lg hover:border-orange-200 transition group relative overflow-hidden">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex items-center gap-4 flex-grow mr-4">
                                <span class="font-bold text-xl ${rankColor} w-8 text-center flex-shrink-0"><i class="fa-solid ${rank <= 3 ? 'fa-medal' : 'fa-hashtag'}"></i> ${rank > 3 ? rank : ''}</span>
                                <h3 class="font-bold text-lg text-textMain group-hover:text-accent transition line-clamp-2">${data.title}</h3>
                            </div>
                            <span class="flex items-center gap-1.5 text-red-500 font-bold bg-red-50 px-3 py-1.5 rounded-full whitespace-nowrap border border-red-100 shadow-sm flex-shrink-0">
                                <i class="fa-solid fa-heart fa-beat"></i> ${data.count}
                            </span>
                        </div>
                        <div class="pl-12 pr-2">
                            <p class="text-sm text-textSub line-clamp-5 leading-relaxed">${safeSummary}</p>
                        </div>
                    </a>
                `;
                rank++;
            });
            html += '</div>';
            container.innerHTML = html;
        } catch(e) {
            console.error("載入熱門總榜失敗", e);
            container.innerHTML = '<p class="text-red-400 text-center py-4">榜單載入失敗</p>';
        }
    };

    window.likeNews = async (index) => {
        const news = window.currentNewsData[index];
        if (!news) return;

        let likedUrls = JSON.parse(localStorage.getItem('tony_liked_news') || '[]');
        if (likedUrls.includes(news.url)) return showToast("您已經推薦過這則新聞囉！", "info");

        const btn = document.getElementById(`btn-like-${index}`);
        const countSpan = document.getElementById(`like-count-${index}`);
        
        if(btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-red-500"></i>';

        try {
            const likesRef = window.FS.collection(window.AppState.db, 'artifacts', window.AppState.appId, 'public', 'data', 'newsLikes');
            const q = window.FS.query(likesRef, window.FS.where("url", "==", news.url));
            const snap = await window.FS.getDocs(q);
            
            let newCount = 1;
            
            if (!snap.empty) {
                const docRef = snap.docs[0].ref;
                newCount = (snap.docs[0].data().count || 0) + 1;
                await window.FS.updateDoc(docRef, { count: newCount, lastUpdated: window.FS.serverTimestamp(), title: news.title, summary: news.summary });
            } else {
                await window.FS.addDoc(likesRef, {
                    url: news.url,
                    title: news.title,
                    summary: news.summary, 
                    count: 1,
                    lastUpdated: window.FS.serverTimestamp()
                });
            }

            likedUrls.push(news.url);
            localStorage.setItem('tony_liked_news', JSON.stringify(likedUrls));

            if(countSpan) countSpan.innerText = newCount;
            if(btn) {
                btn.innerHTML = `<i class="fa-solid fa-heart text-red-500 text-xl"></i> <span class="font-bold text-sm text-red-500">${newCount}</span>`;
                btn.className = "flex items-center gap-2 text-red-500 cursor-default px-3 py-1.5 rounded-full bg-red-50 shadow-inner";
                btn.onclick = null;
            }
            showToast("推薦成功！全網熱門指標已更新", "success");
            
            window.renderAllTimeTrending();

        } catch (e) {
            console.error("按讚失敗", e);
            showToast("系統繁忙，請稍後再試", "error");
            if(btn) btn.innerHTML = `<i class="fa-regular fa-heart text-gray-400 text-xl"></i> <span class="font-bold text-sm text-gray-500">推薦</span>`;
        }
    };

    window.renderMemberDashboard = () => {
        const user = window.AppState.user;
        if(user) {
            document.getElementById('member-name').innerText = user.displayName || user.email.split('@')[0];
            document.getElementById('member-email').innerText = user.email;
            document.getElementById('member-avatar').src = user.photoURL || 'https://placehold.co/100x100?text=' + user.email.charAt(0).toUpperCase();
            window.loadUserBookmarks();
        }
    };

    window.loadUserBookmarks = async () => {
        const container = document.getElementById('member-bookmarks-list');
        if (!container) return;
        try {
            const { db, user } = window.AppState;
            const q = window.FS.query(window.FS.collection(db, "bookmarks"), window.FS.where("userId", "==", user.uid));
            const snap = await window.FS.getDocs(q);
            
            if (snap.empty) {
                container.innerHTML = '<div class="col-span-full py-16 text-center text-textSub bg-gray-50 rounded-xl border border-dashed border-gray-300"><p>您目前還沒有收藏任何專欄文章。</p></div>';
                window.userBookmarksCache = [];
                return;
            }
            
            let bookmarks = [];
            snap.forEach(doc => bookmarks.push({ id: doc.id, ...doc.data() }));
            bookmarks.sort((a, b) => (b.savedAt?.seconds || 0) - (a.savedAt?.seconds || 0));
            window.userBookmarksCache = bookmarks;
            window.renderBookmarks(bookmarks);
        } catch(e) {
            container.innerHTML = '<div class="col-span-full text-center text-red-500">載入失敗，請稍後再試。</div>';
        }
    };

    window.renderBookmarks = (bookmarks) => {
        const container = document.getElementById('member-bookmarks-list');
        if (!container) return;
        if (bookmarks.length === 0) {
            container.innerHTML = '<div class="col-span-full py-16 text-center text-textSub bg-gray-50 rounded-xl border border-dashed border-gray-300"><p>找不到符合條件的收藏。</p></div>';
            return;
        }
        let html = '';
        bookmarks.forEach(data => {
            html += `
                <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                    <div class="h-40 bg-gray-200 relative cursor-pointer" onclick="window.location.hash='#/article/${data.articleId}'">
                        <img src="${data.coverImage}" class="w-full h-full object-cover">

    window.shareArticle = () => {
        const url = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('文章連結已複製到剪貼簿！', 'success');
            }).catch(() => {
                fallbackCopy(url);
            });
        } else {
            fallbackCopy(url);
        }

        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            try {
                document.execCommand('copy');
                showToast('文章連結已複製到剪貼簿！', 'success');
            } catch (err) {
                showToast('複製失敗，請手動複製網址', 'error');

            document.body.removeChild(input);
        }
    };

    window.submitComment = async (e, articleId) => {
        e.preventDefault();
        const user = window.AppState.user;
        if (!user || user.isAnonymous) return showToast('請先登入會員', 'warning');
        
        const input = document.getElementById('comment-input');
        const content = input.value.trim();
        if (!content) return;
        
        const btn = document.getElementById('btn-submit-comment');
        const originalText = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 送出中...';
        
        try {
            const displayName = user.displayName || user.email?.split('@')[0] || '會員讀者';
            const avatarUrl = user.photoURL || ('https://placehold.co/100x100/163A63/FFF?text=' + displayName.charAt(0).toUpperCase());
            
            const commentsRef = window.FS.collection(window.AppState.db, 'artifacts', window.AppState.appId, 'public', 'data', 'comments');
            await window.FS.addDoc(commentsRef, {
                articleId: articleId,

                userName: displayName,
                userAvatar: avatarUrl,
                content: content.replace(/</g, "&lt;").replace(/>/g, "&gt;"),

            btn.disabled = false; btn.innerHTML = originalText;

    window.fetchComments = async (articleId) => {
        const container = document.getElementById('comments-list');
        const countSpan = document.getElementById('comment-count');
        if (!container) return;
        try {
            const commentsRef = window.FS.collection(window.AppState.db, 'artifacts', window.AppState.appId, 'public', 'data', 'comments');
            const q = window.FS.query(commentsRef, window.FS.where("articleId", "==", articleId));
            const snap = await window.FS.getDocs(q);
            
            if (countSpan) countSpan.innerText = snap.size;
            
            if (snap.empty) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400"><p>目前還沒有人留言，來搶頭香吧！</p></div>';
                return;
            }
            
            let commentsData = [];
            snap.forEach(doc => {
                commentsData.push({ id: doc.id, ...doc.data() });
            });
            
            commentsData.sort((a, b) => {
                const timeA = a.createdAt ? a.createdAt.seconds : 0;
                const timeB = b.createdAt ? b.createdAt.seconds : 0;
                return timeB - timeA;
            });
            
            let html = '';
            commentsData.forEach(data => {
                const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString('zh-TW', { hour12: false }) : '剛剛';
                const safeContent = (data.content || '').replace(/\n/g, "<br>");
                html += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex gap-4 animate-[fadeIn_0.3s_ease-out]">
                        <img src="${data.userAvatar}" class="w-10 h-10 rounded-full border border-gray-200 flex-shrink-0 object-cover">
                        <div class="flex-grow">
                            <div class="flex justify-between items-baseline mb-2">
                                <h4 class="font-bold text-sm text-primary">${data.userName}</h4>
                                <span class="text-xs text-gray-400">${date}</span>
                            </div>
                            <p class="text-sm text-gray-700 leading-relaxed">${safeContent}</p>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch(e) {
            console.error("Fetch comments error:", e);
            container.innerHTML = '<div class="text-center py-10 text-red-400"><p>留言載入失敗</p></div>';
        }
    };

    window.handleEmailLogin = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submit-btn');
        const originalText = submitBtn.innerText;
        submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';
        try {
            if (window.authMode === 'login') {
                await window.AuthAPI.signInWithEmailAndPassword(window.AppState.auth, email, password);
                showToast('登入成功！', 'success');
            } else {
                await window.AuthAPI.createUserWithEmailAndPassword(window.AppState.auth, email, password);
                showToast('註冊成功！', 'success');
            }
            window.history.back();
            setTimeout(() => { if (window.location.hash === '#/login') window.location.hash = '#/member'; }, 500);
        } catch (error) {
            let msg = '發生錯誤';
            if (error.code === 'auth/email-already-in-use') msg = '此 Email 已被註冊';
            else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') msg = '帳號或密碼錯誤';
            else if (error.code === 'auth/user-not-found') msg = '找不到此帳號，請先註冊';
            else if (error.code === 'auth/weak-password') msg = '密碼太弱，請至少輸入 6 個字元';

        } finally { submitBtn.disabled = false; submitBtn.innerText = originalText; }

                const url = await window.StorageAPI.getDownloadURL(storageRef);
                
                const range = window.quillEditor.getSelection(true);
                window.quillEditor.insertEmbed(range.index, type, url);
                window.quillEditor.setSelection(range.index + 1);
                showToast('媒體上傳成功！', 'success');
            } catch (error) {

    window.handleTableAction = (action) => {
        if (!window.quillEditor) return;
        const tableModule = window.quillEditor.getModule('table');
        if (!tableModule) return;
        const activeTd = document.querySelector('#editor-container td.selected');
        let keepMenuOpen = false;

        if (action === 'increaseWidth' && activeTd) {
            const currentWidth = activeTd.offsetWidth;
            activeTd.style.minWidth = (currentWidth + 40) + 'px';
            activeTd.style.width = (currentWidth + 40) + 'px';
            keepMenuOpen = true;
        }
        if (action === 'decreaseWidth' && activeTd) {
            const currentWidth = activeTd.offsetWidth;
            activeTd.style.minWidth = Math.max(40, currentWidth - 40) + 'px';
            activeTd.style.width = Math.max(40, currentWidth - 40) + 'px';
            keepMenuOpen = true;
        }
        if (action === 'autoWidth' && activeTd) {
            activeTd.style.minWidth = 'auto';
            activeTd.style.width = 'auto';
            keepMenuOpen = true;
        }
        
        if (action === 'insertRowAbove') tableModule.insertRowAbove();
        if (action === 'insertRowBelow') tableModule.insertRowBelow();
        if (action === 'insertColumnLeft') tableModule.insertColumnLeft();
        if (action === 'insertColumnRight') tableModule.insertColumnRight();
        if (action === 'deleteRow') tableModule.deleteRow();
        if (action === 'deleteColumn') tableModule.deleteColumn();
        if (action === 'deleteTable') tableModule.deleteTable();
        
        if (!keepMenuOpen) {
            document.getElementById('table-context-menu').classList.add('hidden');
        }
    };

        document.getElementById('article-id').value = id || '';

        const icons = Quill.import('ui/icons');
        icons['table'] = '<svg viewBox="0 0 18 18"> <rect class="ql-stroke" height="12" width="12" x="3" y="3"></rect> <line class="ql-stroke" x1="3" x2="15" y1="9" y2="9"></line> <line class="ql-stroke" x1="9" x2="9" y1="3" y2="15"></line> </svg>';

        const toolbarOptions = [
            ['bold', 'italic', 'underline', 'strike'], ['blockquote', 'code-block'],
            [{ 'header': 1 }, { 'header': 2 }], [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'script': 'sub'}, { 'script': 'super' }], [{ 'indent': '-1'}, { 'indent': '+1' }],
            [{ 'size': ['small', false, 'large', 'huge'] }], [{ 'header': [1, 2, 3, 4, 5, 6, false] }],

        ];
        
        window.quillEditor = new Quill('#editor-container', { 
            theme: 'snow', 
            modules: { 
                table: true, 
                toolbar: {
                    container: toolbarOptions,
                    handlers: {
                        image: () => window.quillUploadHandler('image'),
                        video: () => window.quillUploadHandler('video'),
                        table: function() {
                           this.quill.getModule('table').insertTable(3, 3);
                        }
                    }
                }
            } 
        });

        const quillRoot = window.quillEditor.root;
        const editorNode = document.getElementById('editor-container');

        quillRoot.oncontextmenu = (e) => {
            const td = e.target.closest('td');
            if (td) {
                e.preventDefault();
                const menu = document.getElementById('table-context-menu');
                menu.style.top = e.clientY + 'px';
                menu.style.left = e.clientX + 'px';
                menu.classList.remove('hidden');
                
                editorNode.querySelectorAll('td').forEach(el => el.classList.remove('selected'));
                td.classList.add('selected');
            }
        };

        let isResizing = false;
        let startX, startWidth, resizeTd;

        quillRoot.addEventListener('mousemove', (e) => {
            if (isResizing) return;
            const td = e.target.closest('td');
            if (td) {
                const rect = td.getBoundingClientRect();
                if (rect.right - e.clientX < 10 && rect.right - e.clientX >= 0) {
                    td.style.cursor = 'col-resize';
                } else {
                    td.style.cursor = 'text';
                }
            }
        });

        quillRoot.addEventListener('mousedown', (e) => {
            const td = e.target.closest('td');
            if (td) {
                const rect = td.getBoundingClientRect();
                if (rect.right - e.clientX < 10 && rect.right - e.clientX >= 0) {
                    isResizing = true;
                    resizeTd = td;
                    startX = e.clientX;
                    startWidth = td.offsetWidth;
                    e.preventDefault(); 
                }
            }
        });

        if(!window.isTableResizerBound) {
            document.addEventListener('mousemove', (e) => {
                if (isResizing && resizeTd) {
                    const diff = e.clientX - startX;
                    const newWidth = Math.max(40, startWidth + diff);
                    resizeTd.style.width = newWidth + 'px';
                    resizeTd.style.minWidth = newWidth + 'px';
                }
            });

            document.addEventListener('mouseup', () => { 
                if (isResizing) {
                    isResizing = false; 
                    if (resizeTd) resizeTd.style.cursor = 'text';
                    resizeTd = null; 
                }
            });
            window.isTableResizerBound = true;
        }
        
        await window.loadCategories('article-category-input', 'select');

        if (id) {
            const docSnap = await window.FS.getDoc(window.FS.doc(window.AppState.db, "articles", id));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('article-title-input').value = data.title || '';
                document.getElementById('article-excerpt-input').value = data.excerpt || '';
                document.getElementById('article-status-input').value = data.status || 'draft';
                if(data.coverImage) document.getElementById('cover-preview-img').src = data.coverImage;
                if(data.category) document.getElementById('article-category-input').value = data.category;
                if(data.content) window.quillEditor.clipboard.dangerouslyPasteHTML(data.content);
            }
        }
    };

        if (!window.quillEditor) return;
        const htmlContent = window.quillEditor.root.innerHTML;
        if (!window.quillEditor.getText().trim()) return showToast("編輯器內無內容", "warning");

        const btn = document.querySelector('button[onclick="window.formatContentWithAI()"]');
        const originalHtml = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 排版中...'; btn.disabled = true;

        try {
            showToast("請稍候...", "info");
            const safePromptText = "幫文章進行排版與畫重點，用 <strong> 加粗核心概念。直接輸出 HTML，嚴禁包含 markdown 標記。";
            const resultText = await window.callGeminiAPI(safePromptText, htmlContent);
            const cleanText = resultText.replace(new RegExp('\\x60\\x60\\x60html', 'gi'), '').replace(new RegExp('\\x60\\x60\\x60', 'g'), '');
            window.quillEditor.clipboard.dangerouslyPasteHTML(cleanText);
            showToast("排版完成！", "success");
        } catch(e) { if (!e.message.includes("MISSING_API_KEY")) showToast(`排版失敗：${e.message}`, "error"); } 
        finally { btn.innerHTML = originalHtml; btn.disabled = false; }
    };

    window.previewImage = async (event, previewId) => {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById(previewId).src = e.target.result;
            reader.readAsDataURL(file);
            try {
                showToast("上傳圖片中...", "info");
                const storageRef = window.StorageAPI.ref(window.AppState.storage, `site/${Date.now()}_${file.name}`);
                await window.StorageAPI.uploadBytes(storageRef, file);
                const url = await window.StorageAPI.getDownloadURL(storageRef);
                
                if (previewId === 'settings-logo-preview') document.getElementById('hidden-site-logo').value = url;
                else if (previewId === 'settings-preview-img') document.getElementById('hidden-profile-img').value = url;
                else if (previewId === 'cover-preview-img') document.getElementById('article-cover-input').value = url;
                showToast("圖片上傳成功", "success");
            } catch (err) { showToast("上傳失敗", "error"); }
        }
    };

    window.loadSiteSettings = async () => {
        try {
            const docSnap = await window.FS.getDoc(window.FS.doc(window.AppState.db, "settings", "global"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.heroTitle) document.getElementById('settings-hero-title').value = data.heroTitle;
                if (data.heroBio) document.getElementById('settings-hero-bio').value = data.heroBio;
                if (data.skills) document.getElementById('settings-skills').value = data.skills;
                if (data.experience) document.getElementById('settings-experience').value = data.experience;
                if (data.certifications) document.getElementById('settings-certifications').value = data.certifications;
                if (data.books) document.getElementById('settings-books').value = data.books;
                if (data.socialFb) document.getElementById('settings-social-fb').value = data.socialFb;
                if (data.socialLinkedin) document.getElementById('settings-social-linkedin').value = data.socialLinkedin;
                if (data.socialYt) document.getElementById('settings-social-yt').value = data.socialYt;
                if (data.socialIg) document.getElementById('settings-social-ig').value = data.socialIg;
                if (data.socialTiktok) document.getElementById('settings-social-tiktok').value = data.socialTiktok;
                
                if (data.siteLogoUrl) {
                    document.getElementById('settings-logo-preview').src = data.siteLogoUrl;
                    document.getElementById('hidden-site-logo').value = data.siteLogoUrl;
                }
                if (data.profileImageUrl) {
                    document.getElementById('settings-preview-img').src = data.profileImageUrl;
                    document.getElementById('hidden-profile-img').value = data.profileImageUrl;
                }
            }
            const currentKey = window.getApiKey();
            if (currentKey) document.getElementById('settings-api-key').value = currentKey;
        } catch(e) { }
    };

    window.saveSettingsApiKey = () => {
        const key = document.getElementById('settings-api-key').value;
        if (key) window.saveApiKey(key); else showToast("請輸入金鑰", "warning");
    };

    window.saveSiteSettings = async (e) => {
        e.preventDefault();
        try {
            const data = {
                heroTitle: document.getElementById('settings-hero-title').value,
                heroBio: document.getElementById('settings-hero-bio').value,
                skills: document.getElementById('settings-skills').value,
                experience: document.getElementById('settings-experience').value,
                certifications: document.getElementById('settings-certifications').value,
                books: document.getElementById('settings-books').value,
                socialFb: document.getElementById('settings-social-fb').value || '',
                socialLinkedin: document.getElementById('settings-social-linkedin').value || '',
                socialYt: document.getElementById('settings-social-yt').value || '',
                socialIg: document.getElementById('settings-social-ig').value || '',
                socialTiktok: document.getElementById('settings-social-tiktok').value || '',
                siteLogoUrl: document.getElementById('hidden-site-logo').value || '',
                profileImageUrl: document.getElementById('hidden-profile-img').value || '',
                updatedAt: window.FS.serverTimestamp()
            };
            await window.FS.setDoc(window.FS.doc(window.AppState.db, "settings", "global"), data, { merge: true });
            showToast("全域設定已儲存！", "success");
            if (data.siteLogoUrl) {
                const navLogo = document.getElementById('nav-logo-container');
                if (navLogo) navLogo.innerHTML = `<img src="${data.siteLogoUrl}" alt="Logo" class="h-8 w-auto">`;
                const footerLogo = document.getElementById('footer-logo-container');
                if (footerLogo) footerLogo.innerHTML = `<img src="${data.siteLogoUrl}" alt="Logo" class="h-10 w-auto">`;
            }
        } catch(err) { showToast("儲存失敗", "error"); }
    };

    window.subscribeNewsletter = async (e) => {
        e.preventDefault();
        const emailInput = document.getElementById('newsletter-email');
        const email = emailInput.value.trim();
        if (!email) return;

        const btn = e.target.querySelector('button');
        const originalText = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        try {
            await window.FS.addDoc(window.FS.collection(window.AppState.db, "subscribers"), { email: email, timestamp: window.FS.serverTimestamp() });
            showToast('訂閱成功！感謝您的支持', 'success');
            emailInput.value = '';
        } catch(error) { showToast('訂閱失敗，請稍後再試', 'error'); } 
        finally { btn.disabled = false; btn.innerHTML = originalText; }
    };

    window.submitLeadForm = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('lead-submit-btn');
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 送出中...';
        try {
            await window.FS.addDoc(window.FS.collection(window.AppState.db, "leads"), {
                name: document.getElementById('lead-name').value.trim(),
                email: document.getElementById('lead-email').value.trim(),
                company: document.getElementById('lead-company').value.trim(),
                message: document.getElementById('lead-message').value.trim(),
                createdAt: window.FS.serverTimestamp()
            });
            showToast('預約成功！我們將盡快與您聯絡', 'success');
            setTimeout(() => { window.location.hash = '#/'; }, 1500);
        } catch(error) { showToast('送出失敗，請稍後再試', 'error'); } 
        finally { btn.disabled = false; btn.innerText = '送出預約'; }
    };

    window.loadCategories = async (containerId, mode = 'filters') => {
        const container = document.getElementById(containerId);
        if(!container) return;
        try {
            const snap = await window.FS.getDocs(window.FS.query(window.FS.collection(window.AppState.db, "categories"), window.FS.orderBy("order", "asc")));
            if (mode === 'admin') {
                let html = '';
                snap.forEach(doc => { html += `<div class="bg-gray-50 px-4 py-3 rounded border font-medium flex justify-between items-center">${doc.data().name} <button onclick="window.deleteCategory('${doc.id}')" class="text-red-500 hover:text-red-700 text-sm"><i class="fa-solid fa-trash"></i></button></div>`; });
                container.innerHTML = html;
            } else if (mode === 'select') {
                let html = '';
                snap.forEach(doc => { html += `<option value="${doc.data().name}">${doc.data().name}</option>`; });
                container.innerHTML = html;
            } else if (mode === 'filters') {
                let html = `<button onclick="window.filterArticles('全部')" class="cat-btn px-5 py-2 bg-primary text-white rounded-full text-sm">全部</button>`;
                snap.forEach(doc => { html += `<button onclick="window.filterArticles('${doc.data().name}')" class="cat-btn px-5 py-2 bg-white border rounded-full text-sm">${doc.data().name}</button>`; });
                container.innerHTML = html;
            }
        } catch(e) {}
    };

    window.createCategory = async () => {
        const name = document.getElementById('new-category-input').value.trim();
        if(!name) return;
        try {
            await window.FS.addDoc(window.FS.collection(window.AppState.db, "categories"), { name: name, order: Date.now(), createdAt: window.FS.serverTimestamp() });
            showToast("新增分類成功", "success");
            document.getElementById('new-category-input').value = '';
            window.loadCategories('settings-categories-list', 'admin');
        } catch(e) { showToast("新增失敗", "error"); }
    };
    
    window.deleteCategory = (id) => {
        window.showModal('刪除分類', '確定要刪除這個分類嗎？', async () => {
            try {
                await window.FS.deleteDoc(window.FS.doc(window.AppState.db, "categories", id));
                showToast("分類已刪除", "success");
                window.loadCategories('settings-categories-list', 'admin');
            } catch(e) { showToast("刪除失敗", "error"); }
        }, '確定刪除', true);
    };

    window.filterArticles = (category) => {
        window.AppState.currentCategory = category;
        window.fetchPublicArticles();
        document.querySelectorAll('.cat-btn').forEach(btn => {
            if(btn.innerText === category) { btn.className = 'cat-btn px-5 py-2 bg-primary text-white shadow-md text-sm font-medium rounded-full whitespace-nowrap transition'; }
            else { btn.className = 'cat-btn px-5 py-2 bg-white text-textSub border border-gray-200 hover:border-cta hover:text-cta text-sm font-medium rounded-full whitespace-nowrap transition'; }
        });
    };

    window.addEventListener('hashchange', router);
    window.addEventListener('load', () => { router(); });
</script>

</body>
</html>
