<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONY STUDIO | 個人品牌官網與專業內容中心</title>
    
    <!-- Google Fonts: Noto Sans TC & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Quill.js Rich Text Editor CSS -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0B1F3A',    // 深海軍藍
                        secondary: '#163A63',  // 沉穩藍
                        accent: '#C9A24B',     // 暖金
                        cta: '#2563EB',        // 科技藍
                        bg: '#F8F7F3',         // 暖白
                        textMain: '#172033',   // 墨黑藍
                        textSub: '#667085'     // 中性灰
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        serif: ['Noto Serif TC', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.bg');
            color: theme('colors.textMain');
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            line-height: 1.7;
        }
        
        /* Custom Scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.bg'); 
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.secondary'); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.primary'); 
        }

        /* Fade in animation for routing */
        .page-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Quill Editor Styling Fixes for Tailwind */
        .ql-container {
            font-family: 'Inter', 'Noto Sans TC', sans-serif !important;
            font-size: 1rem !important;
            background-color: #ffffff;
            border-bottom-left-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
        }
        .ql-toolbar {
            border-top-left-radius: 0.375rem;
            border-top-right-radius: 0.375rem;
            background-color: #f8fafc;
        }
        .ql-editor {
            min-height: 300px;
        }
        /* 同步編輯器 (.ql-editor) 與前台文章 (.prose) 的樣式，確保完全的所見即所得 */
        .ql-editor h1, .prose h1 { font-size: 2.25rem !important; font-weight: bold !important; margin-bottom: 1rem !important; line-height: 1.3 !important; }
        .ql-editor h2, .prose h2 { font-size: 1.875rem !important; font-weight: bold !important; margin-bottom: 0.875rem !important; line-height: 1.4 !important; }
        .ql-editor h3, .prose h3 { font-size: 1.5rem !important; font-weight: bold !important; margin-bottom: 0.75rem !important; line-height: 1.5 !important; }
        .ql-editor p, .prose p { margin-bottom: 1rem !important; line-height: 1.7 !important; }
        .ql-editor ul, .prose ul { list-style-type: disc !important; padding-left: 1.5rem !important; margin-bottom: 1rem !important; }
        .ql-editor ol, .prose ol { list-style-type: decimal !important; padding-left: 1.5rem !important; margin-bottom: 1rem !important; }
        .ql-editor strong, .prose strong { font-weight: 700 !important; color: #0B1F3A !important; }
        .ql-editor em, .prose em { font-style: italic !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, signInAnonymously, signInWithCustomToken, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, getDoc, doc, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js";

    // 使用規格書提供的 Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBycn2thYzf2H4YRe21cK7SBZPTWCZG8K4",
        authDomain: "k20-tony-blogger.firebaseapp.com",
        projectId: "k20-tony-blogger",
        storageBucket: "k20-tony-blogger.firebasestorage.app",
        messagingSenderId: "322587779924",
        appId: "1:322587779924:web:e3f3c0704902afa2551ec1",
        measurementId: "G-GMKH7KM8N7"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const functions = getFunctions(app);

    // Global App State
    window.AppState = {
        user: null,
        role: null,
        db: db,
        auth: auth,
        storage: storage,
        functions: functions,
        currentCategory: '全部',
        searchQuery: ''
    };

    // Global APIs binding
    window.FS = {
        collection, getDocs, getDoc, doc, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, writeBatch
    };

    window.StorageAPI = {
        ref, uploadBytes, getDownloadURL
    };
    window.FunctionsAPI = {
        httpsCallable
    };

    window.updateSEO = (title, description = '', imageUrl = '') => {
        const baseTitle = 'TONY STUDIO';
        document.title = title === '個人品牌官網與專業內容中心' ? `${baseTitle} | ${title}` : (title ? `${title} | ${baseTitle}` : `${baseTitle} | 個人品牌官網與專業內容中心`);

        let metaDesc = document.querySelector('meta[name="description"]');
        if (!metaDesc) {
            metaDesc = document.createElement('meta');
            metaDesc.name = "description";
            document.head.appendChild(metaDesc);
        }
        metaDesc.content = description || '專注於全端開發、AI 知識庫建置與個人品牌營運。在這裡，我將經驗化為可被搜尋、引用與實踐的知識資產。';
    };

    // --- 新增：全域客製化彈窗 (Modal) ---
    window.showModal = (title, content, onConfirm = null, confirmText = '確認', isDanger = false) => {
        const existing = document.getElementById('custom-modal');
        if (existing) existing.remove();

        const modalHtml = `
            <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 transition-opacity duration-300">
                <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                        <h3 class="text-lg font-bold text-primary">${title}</h3>
                        <button onclick="document.getElementById('custom-modal').remove()" class="text-gray-400 hover:text-gray-700">
                            <i class="fa-solid fa-xmark text-xl"></i>
                        </button>
                    </div>
                    <div class="p-6 text-textMain text-sm">
                        ${content}
                    </div>
                    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-xl flex justify-end gap-3">
                        <button onclick="document.getElementById('custom-modal').remove()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 transition text-sm font-medium">取消</button>
                        ${onConfirm ? `<button id="modal-confirm-btn" class="px-4 py-2 ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-cta hover:bg-blue-700'} text-white rounded transition text-sm font-medium shadow-sm">${confirmText}</button>` : ''}
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        const modal = document.getElementById('custom-modal');
        void modal.offsetWidth; // 觸發動畫
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');

        if (onConfirm) {
            document.getElementById('modal-confirm-btn').onclick = () => {
                onConfirm();
                modal.remove();
            };
        }
    };

    // --- 新增：分類管理系統 ---
    window.loadCategories = async (containerId, mode = 'filters', selected = '') => {
        const container = document.getElementById(containerId);
        if (!container) return;

        try {
            const { db } = window.AppState;
            const { collection, getDocs, query, orderBy } = window.FS;
            const q = query(collection(db, "categories"), orderBy("order", "asc"));
            const snap = await getDocs(q);
            
            let categories = [];
            snap.forEach(doc => categories.push({ id: doc.id, ...doc.data() }));

            // 預設防呆分類 (如果資料庫是空的)
            if (categories.length === 0) {
                categories = [
                    { id: 'default1', name: 'Vibe Coding', order: 1 },
                    { id: 'default2', name: '架構設計', order: 2 },
                    { id: 'default3', name: 'AI 應用', order: 3 }
                ];
            }

            if (mode === 'filters') {
                let html = `<button onclick="window.filterArticles('全部')" data-cat="全部" class="cat-btn px-4 py-1.5 ${window.AppState.currentCategory === '全部' || !window.AppState.currentCategory ? 'bg-primary text-white' : 'bg-bg text-textSub hover:bg-gray-200'} text-sm font-medium rounded-full whitespace-nowrap transition shadow-sm">全部</button>`;
                categories.forEach(cat => {
                    const isActive = window.AppState.currentCategory === cat.name;
                    html += `<button onclick="window.filterArticles('${cat.name}')" data-cat="${cat.name}" class="cat-btn px-4 py-1.5 ${isActive ? 'bg-primary text-white shadow-sm' : 'bg-bg text-textSub hover:bg-gray-200'} text-sm font-medium rounded-full whitespace-nowrap transition">${cat.name}</button>`;
                });
                container.innerHTML = html;
            } else if (mode === 'select') {
                let html = '';
                categories.forEach(cat => {
                    const isSelected = selected === cat.name ? 'selected' : '';
                    html += `<option value="${cat.name}" ${isSelected}>${cat.name}</option>`;
                });
                container.innerHTML = html;
            } else if (mode === 'admin') {
                let html = '';
                categories.forEach(cat => {
                    html += `
                        <div class="flex items-center justify-between bg-gray-50 border border-gray-200 px-4 py-3 rounded group hover:bg-white transition">
                            <span class="font-medium text-gray-700">${cat.name}</span>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                                <button onclick="window.editCategory('${cat.id}', '${cat.name}')" class="w-8 h-8 rounded-full bg-blue-50 text-cta hover:bg-cta hover:text-white transition flex items-center justify-center shadow-sm" title="修改分類"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="window.deleteCategory('${cat.id}', '${cat.name}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition flex items-center justify-center shadow-sm" title="刪除分類"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        } catch (error) {
            console.warn("載入分類發生警告:", error);
            if (mode === 'filters') container.innerHTML = '<span class="text-sm text-gray-500 px-4 py-1">分類載入受限</span>';
            else if (mode === 'admin') container.innerHTML = '<div class="py-4 text-center text-red-500 text-sm"><i class="fa-solid fa-triangle-exclamation mr-2"></i>權限受限：請確認 Firestore 規則已發布。</div>';
            else if (mode === 'select') container.innerHTML = '<option value="">載入失敗</option>';
        }
    };

    window.createCategory = async () => {
        const input = document.getElementById('new-category-input');
        const name = input.value.trim();
        if (!name) return showToast('請輸入分類名稱', 'warning');
        
        const btn = document.getElementById('btn-add-category');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        
        try {
            const { db } = window.AppState;
            const { collection, addDoc, serverTimestamp } = window.FS;
            await addDoc(collection(db, "categories"), {
                name: name,
                order: Date.now(),
                createdAt: serverTimestamp()
            });
            showToast('分類新增成功', 'success');
            input.value = '';
            window.loadCategories('settings-categories-list', 'admin');
        } catch (error) {
            showToast('新增失敗: ' + error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-plus"></i> 新增';
        }
    };

    window.editCategory = (id, oldName) => {
        if (id.startsWith('default')) {
            showToast('這是預設分類。請先新增您的專屬分類後，才能修改。', 'warning');
            return;
        }
        const content = `
            <label class="block mb-2 text-sm font-medium text-gray-700">請輸入新的分類名稱：</label>
            <input type="text" id="edit-cat-input" value="${oldName}" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-cta font-medium">
        `;
        window.showModal('修改分類名稱', content, async () => {
            const newName = document.getElementById('edit-cat-input').value.trim();
            if (!newName || newName === oldName) return;
            try {
                const { db } = window.AppState;
                const { doc, updateDoc } = window.FS;
                await updateDoc(doc(db, "categories", id), { name: newName });
                showToast('分類已更新！', 'success');
                window.loadCategories('settings-categories-list', 'admin');
            } catch (error) {
                showToast('更新失敗，請檢查權限', 'error');
            }
        }, '儲存修改');
    };

    window.deleteCategory = (id, name) => {
        if (id.startsWith('default')) {
            showToast('預設分類無法刪除。', 'warning');
            return;
        }
        const content = `<p>您確定要刪除 <strong>${name}</strong> 嗎？</p><p class="text-red-500 text-xs mt-2 bg-red-50 p-2 rounded">注意：這不會刪除文章，但會讓使用此分類的文章失去對應標籤。</p>`;
        window.showModal('刪除分類確認', content, async () => {
            try {
                const { db } = window.AppState;
                const { doc, deleteDoc } = window.FS;
                await deleteDoc(doc(db, "categories", id));
                showToast('分類已永久刪除', 'success');
                window.loadCategories('settings-categories-list', 'admin');
            } catch (error) {
                showToast('刪除失敗，請檢查權限', 'error');
            }
        }, '確定刪除', true);
    };

    // Enhanced Authentication Handlers
    window.handleEmailRegister = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if(!email || !password) {
            showToast("請輸入信箱與密碼", "warning");
            return;
        }

        try {
            await createUserWithEmailAndPassword(auth, email, password);
            showToast("註冊成功！", "success");
            window.location.hash = '#/member';
        } catch (error) {
            console.error("Registration failed", error);
            if (error.code === 'auth/email-already-in-use') {
                showToast("此信箱已註冊過，請直接切換至「登入」分頁", "error");
            } else if (error.code === 'auth/weak-password') {
                showToast("密碼太弱，至少需要 6 個字元", "warning");
            } else if (error.code === 'auth/operation-not-allowed') {
                showToast("錯誤：尚未在 Firebase Console 啟用 Email/Password 登入功能！", "error");
            } else {
                showToast("註冊失敗：" + error.message, "error");
            }
        }
    };

    window.handleEmailLogin = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!email || !password) {
            showToast("請輸入信箱與密碼", "warning");
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
            showToast("登入成功！", "success");
            window.location.hash = '#/member';
        } catch (error) {
            console.error("Login failed", error);
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                showToast("帳號或密碼錯誤。若尚未註冊請先點擊「註冊」分頁", "error");
            } else if (error.code === 'auth/operation-not-allowed') {
                showToast("錯誤：尚未在 Firebase Console 啟用 Email 登入服務！", "error");
            } else {
                showToast("登入失敗：" + error.message, "error");
            }
        }
    };

    window.handleLogout = async () => {
        try {
            await signOut(auth);
            window.AppState.role = null;
            showToast("已成功登出", "success");
            window.location.hash = '#/';
        } catch (error) {
            console.error("Logout failed", error);
        }
    };

    window.toggleAuthMode = (mode) => {
        const form = document.getElementById('auth-form');
        const btn = document.getElementById('submit-btn');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        
        if (!form || !btn || !tabLogin || !tabRegister) return;
        
        if(mode === 'login') {
            form.onsubmit = window.handleEmailLogin;
            btn.innerText = 'Email 登入';
            tabLogin.className = 'flex-1 px-4 py-2 text-sm font-medium bg-primary text-white border border-primary rounded-l-md transition';
            tabRegister.className = 'flex-1 px-4 py-2 text-sm font-medium bg-white text-primary border border-gray-300 rounded-r-md hover:bg-gray-50 transition';
        } else {
            form.onsubmit = window.handleEmailRegister;
            btn.innerText = '註冊新帳號';
            tabRegister.className = 'flex-1 px-4 py-2 text-sm font-medium bg-primary text-white border border-primary rounded-r-md transition';
            tabLogin.className = 'flex-1 px-4 py-2 text-sm font-medium bg-white text-primary border border-gray-300 rounded-l-md hover:bg-gray-50 transition';
        }
    };

    window.togglePassword = (inputId, iconId) => {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (!input || !icon) return;
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                const idTokenResult = await user.getIdTokenResult(true);
                window.AppState.role = idTokenResult.claims.role || 'member';
            } catch(e) {
                window.AppState.role = 'member';
            }
            window.AppState.user = user;
            updateNavbarAuthUI(user, window.AppState.role);
        } else {
            window.AppState.user = null;
            window.AppState.role = null;
            updateNavbarAuthUI(null, null);
        }
    });

    function updateNavbarAuthUI(user, role) {
        const authContainer = document.getElementById('nav-auth-container');
        if (!authContainer) return;

        if (user) {
            const displayName = user.displayName || user.email?.split('@')[0] || '會員';
            const avatarUrl = user.photoURL || ('https://placehold.co/100x100/163A63/FFF?text=' + displayName.charAt(0).toUpperCase());
            
            const adminLink = (role === 'super_admin' || role === 'admin') 
                ? `<a href="#/admin" class="text-xs font-bold text-accent bg-secondary px-2 py-1 rounded hover:bg-primary transition"><i class="fa-solid fa-gauge mr-1"></i>管理後台</a>` 
                : '';

            authContainer.innerHTML = `
                <div class="flex items-center space-x-4">
                    ${adminLink}
                    <a href="#/member" class="flex items-center space-x-2 text-textSub hover:text-primary transition">
                        <img src="${avatarUrl}" alt="Avatar" class="w-8 h-8 rounded-full border border-gray-200">
                        <span class="text-sm font-medium hidden sm:block">${displayName}</span>
                    </a>
                    <button onclick="window.handleLogout()" class="text-sm text-textSub hover:text-red-600 transition">登入管理/登出</button>
                </div>
            `;
        } else {
            authContainer.innerHTML = `
                <a href="#/login" class="px-5 py-2 text-sm font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>
            `;
        }
    }
</script>

<div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

<script>
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        
        let bgColor = 'bg-primary';
        let icon = 'fa-info-circle';
        
        if (type === 'success') { bgColor = 'bg-green-600'; icon = 'fa-check-circle'; }
        else if (type === 'error') { bgColor = 'bg-red-600'; icon = 'fa-exclamation-circle'; }
        else if (type === 'warning') { bgColor = 'bg-accent'; icon = 'fa-exclamation-triangle'; }

        toast.className = `flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white ${bgColor} transform transition-all duration-300 translate-y-10 opacity-0`;
        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
        
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
        setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }

    window.compressImage = async (file, maxWidth = 1200, maxHeight = 1200, quality = 0.8) => {
        if (!file || !file.type.startsWith('image/')) return file;
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round(height * (maxWidth / width));
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round(width * (maxHeight / height));
                            height = maxHeight;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 💡 判斷原圖是否為 PNG，如果是 PNG 則保留 PNG 格式以維持透明背景
                    const isPng = file.type === 'image/png';
                    const mimeType = isPng ? 'image/png' : 'image/jpeg';
                    const newName = isPng ? file.name : file.name.replace(/\.[^/.]+$/, ".jpg");

                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(new File([blob], newName, { type: mimeType, lastModified: Date.now() }));
                        } else {
                            resolve(file);
                        }
                    }, mimeType, quality);
                };
                img.onerror = () => resolve(file);
            };
            reader.onerror = () => resolve(file);
        });
    };

    window.submitContactForm = async (event) => {
        event.preventDefault();
        const btn = document.getElementById('btn-submit-lead');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 送出中...';

        const name = document.getElementById('lead-name').value;
        const email = document.getElementById('lead-email').value;
        const company = document.getElementById('lead-company').value;
        const type = document.getElementById('lead-type').value;
        const message = document.getElementById('lead-message').value;

        try {
            const { db, storage } = window.AppState;
            const { collection, addDoc, serverTimestamp } = window.FS;
            const { ref, uploadBytes, getDownloadURL } = window.StorageAPI;

            let uploadedAttachments = [];
            const filesToUpload = window.AppState.leadFiles || [];

            // 1. 如果有選擇檔案，開始逐一處理上傳
            if (filesToUpload.length > 0) {
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理附件中...';
                
                for (let i = 0; i < filesToUpload.length; i++) {
                    let file = filesToUpload[i];
                    
                    // 如果是圖片就先進行無損壓縮
                    if (file.type.startsWith('image/')) {
                        file = await window.compressImage(file);
                    }
                    
                    // 將檔案傳到 Firebase Storage
                    const fileRef = ref(storage, `leads/attachments/${Date.now()}_${file.name}`);
                    await uploadBytes(fileRef, file);
                    const fileUrl = await getDownloadURL(fileRef);
                    
                    // 將檔案資訊存入陣列
                    uploadedAttachments.push({
                        name: file.name,
                        url: fileUrl,
                        type: file.type
                    });
                }
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 送出表單中...';
            
            // 2. 將包含附件陣列的表單資訊一次性寫入 Firestore
            const leadData = {
                name, email, company, type, message,
                status: 'new',
                createdAt: serverTimestamp(),
                attachments: uploadedAttachments
            };

            await addDoc(collection(db, "leads"), leadData);

            showToast("感謝您的來信！我們將盡快與您聯繫。", "success");
            
            // 3. 重設表單與清單
            document.getElementById('contact-form').reset();
            window.AppState.leadFiles = [];
            window.renderLeadFileList();

        } catch (error) {
            console.error("Submit Error:", error);
            showToast("送出失敗：" + error.message, "error");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-regular fa-paper-plane mr-2"></i> 送出諮詢';
        }
    };

    window.saveSiteSettings = async (event) => {

        const heroBio = document.getElementById('settings-hero-bio').value;
        const profileInput = document.getElementById('settings-profile-img');

            // 防呆：如果是預設的空圖片或網址，則設為 null 避免覆寫髒資料
            if (!logoFile && (!siteLogoUrl || siteLogoUrl.includes(window.location.host) || siteLogoUrl.includes('placehold.co') || siteLogoUrl === window.location.href)) {

                }
                const logoRef = ref(storage, `site/settings/logo_${Date.now()}.png`);
                await uploadBytes(logoRef, logoFile);
                siteLogoUrl = await getDownloadURL(logoRef);

                heroBio,
                profileImageUrl,

                updateData.siteLogoUrl = siteLogoUrl;

            updateData.books = document.getElementById('settings-books')?.value || '';

            updateData.socialFB = document.getElementById('settings-social-fb')?.value || '';

            updateData.socialIN = document.getElementById('settings-social-in')?.value || '';
            updateData.socialTK = document.getElementById('settings-social-tk')?.value || '';
            updateData.socialBlog = document.getElementById('settings-social-blog')?.value || '';
            updateData.socialLine = document.getElementById('settings-social-line')?.value || '';
            updateData.socialLineOA = document.getElementById('settings-social-lineoa')?.value || '';

            await setDoc(doc(db, "settings", "global"), updateData, { merge: true });

            showToast("網站設定儲存成功！回首頁即可看到變化。", "success");
            
            window.applyGlobalSiteSettings(); // 儲存後立即更新畫面的 LOGO
            
            profileInput.value = ''; 
            if (logoInput) logoInput.value = '';
            
        } catch (error) {

            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 儲存所有設定';

    };

    window.loadAdminDashboard = async () => {
        const tbody = document.getElementById('admin-subscribers-list');
        if (!tbody) return;

        try {
            const { db } = window.AppState;
            const { collection, getDocs, query, orderBy, limit } = window.FS;
            
            // 抓取最新 100 筆訂閱名單
            const subQuery = query(collection(db, "subscribers"), orderBy("subscribedAt", "desc"), limit(100));
            const snap = await getDocs(subQuery);
            
            if (snap.empty) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-8 text-gray-500">目前還沒有人訂閱喔。趕快分享您的網站吧！</td></tr>';
                return;
            }

            let html = '';
            window.AppState.allSubscribers = []; // 存起來供匯出功能使用
            
            snap.forEach(doc => {
                const data = doc.data();
                window.AppState.allSubscribers.push(data);
                const dateStr = data.subscribedAt ? new Date(data.subscribedAt.seconds * 1000).toLocaleString() : '剛訂閱';
                html += `
                    <tr class="hover:bg-gray-50 transition bg-white">
                        <td class="px-6 py-3 text-sm text-gray-500">${dateStr}</td>
                        <td class="px-6 py-3 text-sm font-bold text-gray-800">${data.email}</td>
                        <td class="px-6 py-3 text-sm text-gray-400">${data.source || '首頁'}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        } catch (error) {
            if (error.code === 'permission-denied') {
                console.warn("⚠️ 權限警告：無法載入訂閱名單，因為 Firebase 規則尚未在雲端生效。");
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-8 bg-yellow-50 text-yellow-700 border border-yellow-200 rounded"><i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i><br><b>權限尚未開通</b><br>請在終端機執行 <code>firebase deploy --only firestore:rules</code> 更新安全規則，<br>重新整理網頁後即可看到名單。</td></tr>';
            } else {
                console.error("載入訂閱名單失敗:", error);
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-red-500">無法載入名單，發生未知錯誤。</td></tr>';
            }
        }
    };

    window.exportSubscribers = () => {
        const subs = window.AppState.allSubscribers;
        if (!subs || subs.length === 0) {
            showToast('目前沒有名單可以匯出喔！', 'warning');
            return;
        }
        
        // 加入 \uFEFF (BOM) 確保 Excel 打開 CSV 時中文不會變亂碼
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += "訂閱時間,Email信箱,來源頁面\n";
        
        subs.forEach(row => {
            const dateStr = row.subscribedAt ? new Date(row.subscribedAt.seconds * 1000).toLocaleString() : '未知';
            csvContent += `"${dateStr}","${row.email}","${row.source || '首頁'}"\n`;
        });
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `TONY_STUDIO_訂閱名單_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showToast('名單匯出成功！可以打開 Excel 檢視了', 'success');
    };

    window.setAskTonyInput = (text) => {
        const input = document.getElementById('ask-tony-input');
        if (input) {
            input.value = text;
            input.focus();
        }
    };

    window.clearChat = () => {
        const chatHistory = document.getElementById('chat-history');
        if (chatHistory) {
            chatHistory.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                    <div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] leading-relaxed shadow-sm">
                        已清除對話紀錄。還有什麼我可以幫忙的嗎？
                    </div>
                </div>
            `;
        }
    };

    window.submitAskTony = async (event) => {
        event.preventDefault();
        const inputEl = document.getElementById('ask-tony-input');
        const btnEl = document.getElementById('ask-tony-btn');
        const chatHistory = document.getElementById('chat-history');
        const query = inputEl.value.trim();
        if (!query) return;

        const userAvatar = window.AppState.user?.photoURL || 'https://placehold.co/100x100/2563EB/FFF?text=U';
        chatHistory.insertAdjacentHTML('beforeend', `
            <div class="flex gap-4 justify-end">
                <div class="bg-cta p-4 rounded-2xl rounded-tr-none text-white text-sm max-w-[85%] leading-relaxed shadow-sm">
                    ${query}
                </div>
                <img src="${userAvatar}" class="w-8 h-8 rounded-full flex-shrink-0 border border-gray-200">
            </div>
        `);
        
        inputEl.value = '';
        btnEl.disabled = true;
        btnEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        chatHistory.scrollTop = chatHistory.scrollHeight;

        const loadingId = 'loading-' + Date.now();
        chatHistory.insertAdjacentHTML('beforeend', `
            <div id="${loadingId}" class="flex gap-4">
                <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                <div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] flex items-center gap-2 shadow-sm border border-transparent animate-pulse">
                    <i class="fa-solid fa-circle-notch fa-spin text-accent"></i> 正在詢問 Ask TONY...
                </div>
            </div>
        `);
        chatHistory.scrollTop = chatHistory.scrollHeight;

        try {
            const { db, functions } = window.AppState;
            const { collection, getDocs, query: fsQuery, where, orderBy, limit } = window.FS;
            const { httpsCallable } = window.FunctionsAPI;
            
            const q = fsQuery(
                collection(db, "articles"), 
                where("status", "==", "published"), 
                where("visibility", "==", "public"), 
                orderBy("createdAt", "desc"), 
                limit(3)
            );
            const snap = await getDocs(q);
            
            let contextText = "【以下是從 TONY STUDIO 知識庫檢索到的相關文章內容】：\n\n";
            snap.forEach(doc => {
                const data = doc.data();
                const plainContent = (data.content || '').replace(/<[^>]*>?/gm, ''); 
                contextText += `標題：${data.title}\n摘要：${data.excerpt}\n正文：${plainContent.substring(0, 1000)}...\n\n`;
            });

            // 恢復呼叫 Cloud Functions
            const askTonyCloud = httpsCallable(functions, 'askTony');
            const result = await askTonyCloud({ query, contextText });
            const aiText = result.data.text;

            const formattedHtml = aiText
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-primary">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');

            document.getElementById(loadingId).outerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                    <div class="bg-white border border-gray-200 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] leading-relaxed shadow-sm">
                        ${formattedHtml}
                        <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-[10px] text-gray-400"><i class="fa-solid fa-shield-halved text-green-500"></i> 後端加密處理</span>
                        </div>
                    </div>
                </div>
            `;
        } catch (err) {
            console.error("Ask TONY Error:", err);
            showToast("AI 回覆失敗：" + err.message, "error");
            document.getElementById(loadingId).outerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                    <div class="bg-red-50 border border-red-200 p-4 rounded-2xl rounded-tl-none text-red-700 text-sm max-w-[85%] leading-relaxed shadow-sm">
                        抱歉，連線到 AI 時發生錯誤：${err.message}
                    </div>
                </div>
            `;
        } finally {
            btnEl.disabled = false;
            btnEl.innerHTML = '<i class="fa-regular fa-paper-plane mr-2"></i> 送出';
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    };

    window.previewImage = (event, imgId) => {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById(imgId);
                if(img) img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    };

    window.applyGlobalSiteSettings = async () => {
        try {
            const { db } = window.AppState;
            const { doc, getDoc } = window.FS;
            const docSnap = await getDoc(doc(db, "settings", "global"));
            if (docSnap.exists() && docSnap.data().siteLogoUrl) {
                const logoUrl = docSnap.data().siteLogoUrl;
                const navContainer = document.getElementById('nav-logo-container');
                const footerContainer = document.getElementById('footer-logo-container');
                if (navContainer) {
                    navContainer.innerHTML = `<img src="${logoUrl}" class="h-8 w-auto object-contain" alt="LOGO">`;
                }
                if (footerContainer) {
                    footerContainer.innerHTML = `<img src="${logoUrl}" class="h-10 w-auto object-contain brightness-0 invert opacity-90" alt="LOGO">`;
                }
            }
        } catch (e) {
            console.warn("LOGO 載入受限或無設定");
        }
    };

    window.addEventListener('hashchange', router);
    window.addEventListener('load', () => {
        router();
        window.applyGlobalSiteSettings(); // 網頁載入時立刻替換全站 LOGO
    });
</script>

</body>
</html>
