    const storage = getStorage(app);
    const functions = getFunctions(app);

    // Global App State
    window.AppState = {
        user: null,
        role: null,
        db: db,
        auth: auth,
        storage: storage,
        functions: functions,
        currentCategory: '全部',
        searchQuery: ''

    // Global APIs binding
    window.FS = {
        collection, getDocs, getDoc, doc, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, writeBatch
    };

    window.StorageAPI = {
        ref, uploadBytes, getDownloadURL
    };
    window.FunctionsAPI = {
        httpsCallable
    };

    // Enhanced Authentication Handlers with clear diagnostic messages
    window.handleEmailRegister = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if(!email || !password) {
            showToast("請輸入信箱與密碼", "warning");
            return;
        }

        try {
            await createUserWithEmailAndPassword(auth, email, password);
            showToast("註冊成功！", "success");
            window.location.hash = '#/member';
        } catch (error) {
            console.error("Registration failed", error);
            if (error.code === 'auth/email-already-in-use') {
                showToast("此信箱已註冊過，請直接切換至「登入」分頁", "error");
            } else if (error.code === 'auth/weak-password') {
                showToast("密碼太弱，至少需要 6 個字元", "warning");
            } else if (error.code === 'auth/operation-not-allowed') {
                showToast("錯誤：尚未在 Firebase Console 啟用 Email/Password 登入功能！", "error");
            } else {
                showToast("註冊失敗：" + error.message, "error");
            }
        }
    };

    window.handleEmailLogin = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!email || !password) {
            showToast("請輸入信箱與密碼", "warning");
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
            showToast("登入成功！", "success");
            window.location.hash = '#/member';
        } catch (error) {
            console.error("Login failed", error);
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                showToast("帳號或密碼錯誤。若尚未註冊請先點擊「註冊」分頁，或檢查 Firebase 是否已啟用 Email 登入", "error");
            } else if (error.code === 'auth/operation-not-allowed') {
                showToast("錯誤：尚未在 Firebase Console 啟用 Email/Password 登入服務！", "error");
            } else {
                showToast("登入失敗：" + error.message, "error");
            }
        }
    };

    window.handleLogout = async () => {
        try {
            await signOut(auth);
            window.AppState.role = null;
            showToast("已成功登出", "success");
            window.location.hash = '#/';
        } catch (error) {
            console.error("Logout failed", error);
        }
    };

    window.toggleAuthMode = (mode) => {
        const form = document.getElementById('auth-form');
        const btn = document.getElementById('submit-btn');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        
        if (!form || !btn || !tabLogin || !tabRegister) return;
        
        if(mode === 'login') {
            form.onsubmit = window.handleEmailLogin;
            btn.innerText = 'Email 登入';
            tabLogin.className = 'flex-1 px-4 py-2 text-sm font-medium bg-primary text-white border border-primary rounded-l-md transition';
            tabRegister.className = 'flex-1 px-4 py-2 text-sm font-medium bg-white text-primary border border-gray-300 rounded-r-md hover:bg-gray-50 transition';
        } else {
            form.onsubmit = window.handleEmailRegister;
            btn.innerText = '註冊新帳號';
            tabRegister.className = 'flex-1 px-4 py-2 text-sm font-medium bg-primary text-white border border-primary rounded-r-md transition';
            tabLogin.className = 'flex-1 px-4 py-2 text-sm font-medium bg-white text-primary border border-gray-300 rounded-l-md hover:bg-gray-50 transition';
        }
    };

    window.togglePassword = (inputId, iconId) => {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (!input || !icon) return;
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                const idTokenResult = await user.getIdTokenResult(true);
                window.AppState.role = idTokenResult.claims.role || 'member';
            } catch(e) {
                window.AppState.role = 'member';
            }
            window.AppState.user = user;
            updateNavbarAuthUI(user, window.AppState.role);
        } else {
            window.AppState.user = null;
            window.AppState.role = null;
            updateNavbarAuthUI(null, null);
        }
    });

    function updateNavbarAuthUI(user, role) {
        const authContainer = document.getElementById('nav-auth-container');
        if (!authContainer) return;

        if (user) {
            const displayName = user.displayName || user.email?.split('@')[0] || '會員';
            const avatarUrl = user.photoURL || ('https://placehold.co/100x100/163A63/FFF?text=' + displayName.charAt(0).toUpperCase());
            
            const adminLink = (role === 'super_admin' || role === 'admin') 
                ? `<a href="#/admin" class="text-xs font-bold text-accent bg-secondary px-2 py-1 rounded hover:bg-primary transition"><i class="fa-solid fa-gauge mr-1"></i>管理後台</a>` 
                : '';

            authContainer.innerHTML = `
                <div class="flex items-center space-x-4">
                    ${adminLink}
                    <a href="#/member" class="flex items-center space-x-2 text-textSub hover:text-primary transition">
                        <img src="${avatarUrl}" alt="Avatar" class="w-8 h-8 rounded-full border border-gray-200">
                        <span class="text-sm font-medium hidden sm:block">${displayName}</span>
                    </a>
                    <button onclick="window.handleLogout()" class="text-sm text-textSub hover:text-red-600 transition">登入管理/登出</button>
                </div>
            `;
        } else {
            authContainer.innerHTML = `
                <a href="#/login" class="px-5 py-2 text-sm font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>
            `;
        }
    }
</script>

<script>
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        
        let bgColor = 'bg-primary';
        let icon = 'fa-info-circle';
        
        if (type === 'success') { bgColor = 'bg-green-600'; icon = 'fa-check-circle'; }
        else if (type === 'error') { bgColor = 'bg-red-600'; icon = 'fa-exclamation-circle'; }
        else if (type === 'warning') { bgColor = 'bg-accent'; icon = 'fa-exclamation-triangle'; }

        toast.className = `flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white ${bgColor} transform transition-all duration-300 translate-y-10 opacity-0`;
        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
        
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
        setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }
</script>

    window.fetchPublicArticles = async () => {
        const container = document.getElementById('articles-list-container');
        if (!container) return;
        container.innerHTML = '<div class="col-span-full py-12 text-center"><i class="fa-solid fa-spinner fa-spin text-3xl text-cta mb-4"></i></div>';
        
        try {
            const currentCategory = window.AppState.currentCategory || '全部';
            const searchQuery = window.AppState.searchQuery || '';
            const { db } = window.AppState;
            const { collection, getDocs, query, where, orderBy } = window.FS;
            
            let constraints = [
                where("status", "==", "published"),
                where("visibility", "==", "public")
            ];
            
            if (currentCategory !== '全部') {
                constraints.push(where("category", "==", currentCategory));
            }
            constraints.push(orderBy("createdAt", "desc"));
            
            const q = query(collection(db, "articles"), ...constraints);
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                container.innerHTML = '<div class="col-span-full py-12 text-center text-textSub">目前還沒有符合條件的文章喔。</div>';
                return;
            }

            let html = '';
            querySnapshot.forEach((doc) => {
                const article = doc.data();
                if (searchQuery) {
                    const title = (article.title || '').toLowerCase();
                    const excerpt = (article.excerpt || '').toLowerCase();
                    if (!title.includes(searchQuery) && !excerpt.includes(searchQuery)) return;
                }

                const dateStr = article.createdAt ? new Date(article.createdAt.seconds * 1000).toISOString().split('T')[0] : '剛剛發布';
                const cover = article.coverImage || 'https://placehold.co/800x400/E2E8F0/64748B?text=TONY+STUDIO';
                
                html += `
                    <div class="group bg-white rounded-lg border border-gray-200 overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col">
                        <div class="h-48 bg-gray-200 relative overflow-hidden cursor-pointer" onclick="window.location.hash='#/article/${doc.id}'">
                            <img src="${cover}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="Cover">
                            <div class="absolute top-4 left-4 bg-primary text-white text-xs font-bold px-3 py-1 rounded shadow">${article.category || '未分類'}</div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex items-center text-xs text-textSub mb-3 gap-4">
                                <span><i class="fa-regular fa-calendar mr-1"></i> ${dateStr}</span>
                            </div>
                            <h3 class="text-xl font-bold text-textMain mb-3 group-hover:text-cta transition line-clamp-2 cursor-pointer" onclick="window.location.hash='#/article/${doc.id}'">${article.title}</h3>
                            <p class="text-sm text-textSub line-clamp-3 mb-6 flex-grow">${article.excerpt}</p>
                            <a href="#/article/${doc.id}" class="text-cta text-sm font-bold flex items-center gap-1 hover:text-blue-800 mt-auto">
                                閱讀更多 <i class="fa-solid fa-arrow-right text-xs"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html || '<div class="col-span-full py-12 text-center text-textSub">沒有找到符合關鍵字的文章。</div>';
        } catch (error) {
            if (error.code === 'permission-denied') {
                console.warn("⚠️ 權限不足：無法讀取文章。請部署 firestore.rules 開放讀取權限。");
                container.innerHTML = '<div class="col-span-full py-12 text-center text-accent"><i class="fa-solid fa-lock text-3xl mb-4 block"></i><p>資料庫權限不足，請先至 Firebase Console 更新 Firestore Rules。</p></div>';

            window.quillEditor = null;
        }
        
        const editorContainer = document.getElementById('editor-container');
        if (editorContainer) {
            editorContainer.innerHTML = '';
            
            const imageHandler = () => {
                // 1. 動態建立一個隱藏的 input type="file"
                const input = document.createElement('input');
                input.setAttribute('type', 'file');
                input.setAttribute('accept', 'image/*');
                input.click(); // 觸發點擊，打開選檔視窗
                
                input.onchange = async () => {
                    const file = input.files[0];
                    if (file) {
                        try {
                            showToast("圖片壓縮與上傳中...", "info");
                            
                            // 2. 呼叫共用的圖片壓縮函式 (最大 1200px 寬)

                            // 3. 上傳到 Firebase Storage
                            const { storage } = window.AppState;
                            const { ref, uploadBytes, getDownloadURL } = window.StorageAPI;
                            const fileRef = ref(storage, `articles/general/images/${Date.now()}_${compressed.name}`);
                            await uploadBytes(fileRef, compressed);
                            
                            // 4. 取得 Firebase 回傳的公開網址
                            const url = await getDownloadURL(fileRef);
                            
                            // 5. 將網址作為 img 標籤插入到編輯器目前游標的位置
                            const range = window.quillEditor.getSelection(true);
                            window.quillEditor.insertEmbed(range.index, 'image', url);
                            
                            // 將游標移到圖片後方，方便繼續打字
                            window.quillEditor.setSelection(range.index + 1);
                            
                            showToast("圖片插入成功！", "success");
                        } catch (e) {
                            console.error(e);
                            showToast("圖片上傳失敗：" + e.message, "error");
                        }
                    }
                };
            };

            window.quillEditor = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: '在這裡開始撰寫您的精彩內容...',
                modules: {
                    toolbar: {
                        container: [
                            [{ 'header': [1, 2, 3, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['link', 'image'],
                            ['clean']
                        ],
                        handlers: {
                            // 覆寫 Quill 預設的 image 處理行為，改用我們剛剛寫的 imageHandler
                            image: imageHandler
                        }
                    }
                }
            });
        }
        
        const coverFileInput = document.getElementById('article-cover-file');
        if (coverFileInput) {
            coverFileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        document.getElementById('cover-preview-img').src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

        // 預先載入分類選項，填入下拉選單
        await window.loadCategories('article-category-input', 'select');
            
        if (id) {
            try {
                const { db } = window.AppState;
                const { doc, getDoc } = window.FS;
                const docSnap = await getDoc(doc(db, "articles", id));
                if (docSnap.exists()) {

                    document.getElementById('article-cover-input').value = data.coverImage || '';
                    if (data.coverImage) {

                    document.getElementById('article-excerpt-input').value = data.excerpt || '';

    window.compressImage = async (file, maxWidth = 1200, maxHeight = 1200, quality = 0.8) => {
        if (!file || !file.type.startsWith('image/')) return file;
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round(height * (maxWidth / width));
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round(width * (maxHeight / height));
                            height = maxHeight;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        if (blob) {
                            const newName = file.name.replace(/\.[^/.]+$/, ".jpg");
                            resolve(new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() }));
                        } else {
                            resolve(file);
                        }
                    }, 'image/jpeg', quality);

    window.showModal = (type, title, message, defaultValue = '', onConfirm) => {
        // 先移除可能殘留的彈窗
        const existingModal = document.getElementById('custom-modal');
        if (existingModal) existingModal.remove();

        const isPrompt = type === 'prompt';
        const inputHtml = isPrompt ? `<input type="text" id="modal-input" class="w-full px-4 py-2 mt-4 border border-gray-300 rounded focus:outline-none focus:border-cta text-sm" value="${defaultValue}">` : '';

        // 建立彈窗的 HTML 結構
        const modalHtml = `
            <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-50 transition-opacity">
                <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4">
                    <h3 class="text-xl font-bold text-primary mb-2">${title}</h3>
                    <p class="text-sm text-gray-600">${message}</p>
                    ${inputHtml}
                    <div class="mt-6 flex justify-end gap-3">
                        <button id="modal-cancel" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition">取消</button>
                        <button id="modal-confirm" class="px-4 py-2 text-sm font-medium text-white bg-cta hover:bg-blue-700 rounded transition shadow-sm">確認</button>
                    </div>
                </div>
            </div>
        `;
        
        // 插入到畫面中
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        const modalEl = document.getElementById('custom-modal');
        const inputEl = document.getElementById('modal-input');
        
        // 如果是輸入框模式，自動聚焦並選取文字方便修改
        if (isPrompt && inputEl) {
            inputEl.focus();
            inputEl.select();
        }

        // 綁定關閉事件
        const closeModal = () => modalEl.remove();

        document.getElementById('modal-cancel').onclick = closeModal;
        document.getElementById('modal-confirm').onclick = () => {
            const result = isPrompt ? inputEl.value : true;
            if (isPrompt && (!result || result.trim() === '')) {
                showToast('請輸入有效名稱', 'warning');
                return;
            }
            closeModal();
            if (onConfirm) onConfirm(isPrompt ? result.trim() : true);
        };
    };

    window.editCategory = (oldCat) => {
        window.showModal('prompt', '修改分類', `請輸入「${oldCat}」的新名稱：`, oldCat, async (newCatTrimmed) => {
            if (newCatTrimmed === oldCat) return;
            
            showToast("分類更新中，並同步修改相關文章，請稍候...", "info");

            try {
                const { db } = window.AppState;
                const { doc, getDoc, setDoc, collection, query, where, getDocs, writeBatch } = window.FS;
                const catRef = doc(db, "settings", "categories");
                const docSnap = await getDoc(catRef);
                
                let categories = [];
                if (docSnap.exists() && docSnap.data().list) {
                    categories = docSnap.data().list;
                }

                if (categories.includes(newCatTrimmed)) {
                    showToast("此分類名稱已經存在囉！", "warning");
                    return;
                }

                // 1. 更新全域分類陣列中的名稱
                const index = categories.indexOf(oldCat);
                if (index !== -1) {
                    categories[index] = newCatTrimmed;
                    await setDoc(catRef, { list: categories });
                }

                // 2. 批次更新 (Batch) 找出所有掛著「舊分類」的文章，改為「新分類」
                const q = query(collection(db, "articles"), where("category", "==", oldCat));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const batch = writeBatch(db);
                    querySnapshot.forEach((articleDoc) => {
                        batch.update(articleDoc.ref, { category: newCatTrimmed });
                    });
                    await batch.commit();
                }

                showToast(`分類已成功修改為「${newCatTrimmed}」！`, "success");
                await window.loadCategories('settings-categories-list', 'admin');
            } catch (error) {
                console.error(error);
                showToast("修改分類失敗，請確認資料庫連線", "error");
            }
        });
    };

                document.getElementById('settings-preview-img').src = profileImageUrl;
            }

            btn.innerHTML = '<i class="fa-solid fa-database"></i> 更新資料庫...';
            // 將設定寫入 Firestore
            await setDoc(doc(db, "settings", "global"), {
                heroTitle,
                heroBio,
                profileImageUrl,
                updatedAt: serverTimestamp()
            }, { merge: true });

            showToast("網站設定儲存成功！回首頁即可看到變化。", "success");
            fileInput.value = ''; // 清空選擇檔案狀態
        } catch (error) {
            showToast("儲存失敗：" + error.message, "error");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 儲存所有設定';
        }
    };

    window.setAskTonyInput = (text) => {
        const input = document.getElementById('ask-tony-input');
        if (input) {
            input.value = text;
            input.focus();
        }
    };

    window.clearChat = () => {
        const chatHistory = document.getElementById('chat-history');
        if (chatHistory) {
            chatHistory.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                    <div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] leading-relaxed shadow-sm">
                        已清除對話紀錄。還有什麼我可以幫忙的嗎？
                    </div>
                </div>
            `;
        }
    };

    window.submitAskTony = async (event) => {
        event.preventDefault();
        const inputEl = document.getElementById('ask-tony-input');
        const btnEl = document.getElementById('ask-tony-btn');
        const chatHistory = document.getElementById('chat-history');
        const query = inputEl.value.trim();
        if (!query) return;

        const userAvatar = window.AppState.user?.photoURL || 'https://placehold.co/100x100/2563EB/FFF?text=U';
        chatHistory.insertAdjacentHTML('beforeend', `
            <div class="flex gap-4 justify-end">
                <div class="bg-cta p-4 rounded-2xl rounded-tr-none text-white text-sm max-w-[85%] leading-relaxed shadow-sm">
                    ${query}
                </div>
                <img src="${userAvatar}" class="w-8 h-8 rounded-full flex-shrink-0 border border-gray-200">
            </div>
        `);
        
        inputEl.value = '';
        btnEl.disabled = true;
        btnEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        chatHistory.scrollTop = chatHistory.scrollHeight;

        const loadingId = 'loading-' + Date.now();
        chatHistory.insertAdjacentHTML('beforeend', `
            <div id="${loadingId}" class="flex gap-4">
                <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                <div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] flex items-center gap-2 shadow-sm border border-transparent animate-pulse">
                    <i class="fa-solid fa-circle-notch fa-spin text-accent"></i> 正在透過安全後端詢問 Ask TONY...
                </div>
            </div>
        `);
        chatHistory.scrollTop = chatHistory.scrollHeight;

        try {
            const { db } = window.AppState;
            const { collection, getDocs, query: fsQuery, where, orderBy, limit } = window.FS;
            
            const q = fsQuery(
                collection(db, "articles"), 
                where("status", "==", "published"), 
                where("visibility", "==", "public"), 
                orderBy("createdAt", "desc"), 
                limit(3)
            );
            const snap = await getDocs(q);
            
            let contextText = "【以下是從 TONY STUDIO 知識庫檢索到的相關文章內容】：\n\n";
            snap.forEach(doc => {
                const data = doc.data();
                const plainContent = (data.content || '').replace(/<[^>]*>?/gm, ''); 
                contextText += `標題：${data.title}\n摘要：${data.excerpt}\n正文：${plainContent.substring(0, 1000)}...\n\n`;
            });

            const { functions } = window.AppState;
            const { httpsCallable } = window.FunctionsAPI;
            const askTonyFunction = httpsCallable(functions, 'askTony');

            const result = await askTonyFunction({ 
                query: query,
                contextText: contextText
            });

            const aiText = result.data.text;
            const formattedHtml = aiText
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-primary">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');

            document.getElementById(loadingId).outerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                    <div class="bg-white border border-gray-200 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] leading-relaxed shadow-sm">
                        ${formattedHtml}
                        <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-[10px] text-gray-400"><i class="fa-solid fa-bolt text-accent"></i> Gemini 雲端後端驅動</span>
                        </div>
                    </div>
                </div>
            `;
        } catch (err) {
            console.error("Ask TONY Error:", err);
            document.getElementById(loadingId).outerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-red-600 flex-shrink-0 flex items-center justify-center text-white font-bold shadow-sm"><i class="fa-solid fa-exclamation"></i></div>
                    <div class="bg-red-50 text-red-700 border border-red-200 p-4 rounded-2xl rounded-tl-none text-sm max-w-[85%] shadow-sm">
                        抱歉，AI 發生錯誤：<br><span class="text-xs font-mono mt-1 block">${err.message}</span>
                    </div>
                </div>
            `;
        } finally {
            btnEl.disabled = false;
            btnEl.innerHTML = '<i class="fa-regular fa-paper-plane mr-2"></i> 送出';
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    };

    window.addEventListener('hashchange', router);
    window.addEventListener('load', router);
</script>

</body>
</html>
