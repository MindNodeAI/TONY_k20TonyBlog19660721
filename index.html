    const firebaseConfig = {
        apiKey: "AIzaSyBycn2thYzf2H4YRe21cK7SBZPTWCZG8K4",
        authDomain: "k20-tony-blogger.firebaseapp.com",
        projectId: "k20-tony-blogger",

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const functions = getFunctions(app);

    window.AppState = { user: null, role: null, db: db, auth: auth, storage: storage, functions: functions, currentCategory: '全部', searchQuery: '' };

    window.FunctionsAPI = { httpsCallable };
    window.AuthAPI = { createUserWithEmailAndPassword, signInWithEmailAndPassword };

    window.updateSEO = (title, description = '', imageUrl = '') => {
        const baseTitle = 'TONY STUDIO';
        document.title = title === '個人品牌官網與專業內容中心' ? `${baseTitle} | ${title}` : (title ? `${title} | ${baseTitle}` : `${baseTitle} | 個人品牌官網與專業內容中心`);
    };

    window.showModal = (title, content, onConfirm = null, confirmText = '確認', isDanger = false) => {
        const existing = document.getElementById('custom-modal');
        if (existing) existing.remove();
        const modalHtml = `
            <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 transition-opacity duration-300">
                <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                        <h3 class="text-lg font-bold text-primary">${title}</h3>
                        <button onclick="document.getElementById('custom-modal').remove()" class="text-gray-400 hover:text-gray-700"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <div class="p-6 text-textMain text-sm leading-relaxed">${content}</div>
                    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-xl flex justify-end gap-3">
                        <button onclick="document.getElementById('custom-modal').remove()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 transition text-sm font-medium">取消</button>
                        ${onConfirm ? `<button id="modal-confirm-btn" class="px-4 py-2 ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-cta hover:bg-blue-700'} text-white rounded transition text-sm font-medium shadow-sm">${confirmText}</button>` : ''}
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        const modal = document.getElementById('custom-modal');
        void modal.offsetWidth; 
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
        if (onConfirm) {
            document.getElementById('modal-confirm-btn').onclick = () => { onConfirm(); modal.remove(); };
        }
    };

    window.handleLogout = async () => {
        try { await signOut(auth); window.AppState.role = null; showToast("已成功登出", "success"); window.location.hash = '#/'; } 
        catch (error) { console.error("Logout failed", error); }
    };

    window.toggleMobileMenu = () => {
        const menu = document.getElementById('mobile-menu');
        const icon = document.getElementById('mobile-menu-icon');
        if (!menu || !icon) return;
        
        if (menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-xmark');
        } else {
            menu.classList.add('hidden');
            icon.classList.remove('fa-xmark');
            icon.classList.add('fa-bars');
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                const idTokenResult = await user.getIdTokenResult(true);
                window.AppState.role = idTokenResult.claims.role || 'member';
                // 站長絕對權限防護
                if (user.email === 'mindnodeai@gmail.com') {
                    window.AppState.role = 'super_admin';
                }
            } catch(e) {
                window.AppState.role = (user.email === 'mindnodeai@gmail.com') ? 'super_admin' : 'member';
            }
            window.AppState.user = user;
        } else {
            window.AppState.user = null; window.AppState.role = null;
        }
        updateNavbarAuthUI(window.AppState.user, window.AppState.role);
    });

    function updateNavbarAuthUI(user, role) {
        const authContainer = document.getElementById('nav-auth-container');
        const mobileAuthContainer = document.getElementById('mobile-auth-container');
        if (!authContainer) return;

        if (user) {
            const displayName = user.displayName || user.email?.split('@')[0] || '會員';
            const avatarUrl = user.photoURL || ('https://placehold.co/100x100/163A63/FFF?text=' + displayName.charAt(0).toUpperCase());
            const adminLink = (role === 'super_admin' || role === 'admin') 
                ? `<a href="#/admin" class="text-xs font-bold text-accent bg-secondary px-2 py-1 rounded hover:bg-primary transition"><i class="fa-solid fa-gauge mr-1"></i>管理後台</a>` : '';

            authContainer.innerHTML = `
                <div class="flex items-center space-x-4">
                    ${adminLink}
                    <a href="#/member" class="flex items-center space-x-2 text-textSub hover:text-primary transition bg-gray-50 px-2 py-1.5 rounded-full border border-gray-100">
                        <img src="${avatarUrl}" alt="Avatar" class="w-7 h-7 rounded-full border border-gray-200">
                        <span class="text-sm font-medium hidden sm:block pr-2">${displayName}</span>
                    </a>
                    <button onclick="window.handleLogout()" class="text-sm text-gray-400 hover:text-red-600 transition" title="登出"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            `;
            if (mobileAuthContainer) mobileAuthContainer.innerHTML = `
                <div class="flex items-center space-x-3 px-3 py-3 bg-gray-50 rounded-lg mb-2">
                    <img src="${avatarUrl}" alt="Avatar" class="w-10 h-10 rounded-full border border-gray-200 shadow-sm">
                    <div>
                        <p class="text-sm font-bold text-textMain">${displayName}</p>
                        ${(role === 'super_admin' || role === 'admin') ? `<a href="#/admin" onclick="window.toggleMobileMenu()" class="text-xs font-bold text-accent"><i class="fa-solid fa-gauge"></i> 進入管理後台</a>` : ''}
                    </div>
                </div>
                <a href="#/member" onclick="window.toggleMobileMenu()" class="block px-3 py-3 rounded-md text-base font-medium text-textMain hover:bg-gray-50 transition border border-gray-100 mb-2 text-center">進入會員專區</a>
                <button onclick="window.toggleMobileMenu(); window.handleLogout();" class="w-full text-center block px-3 py-3 rounded-md text-base font-medium text-red-600 bg-red-50 hover:bg-red-100 transition shadow-sm">登出帳號</button>
            `;
        } else {
            authContainer.innerHTML = `<a href="#/login" class="px-5 py-2 text-sm font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>`;
            if (mobileAuthContainer) mobileAuthContainer.innerHTML = `<a href="#/login" onclick="window.toggleMobileMenu()" class="block w-full text-center px-5 py-3 text-base font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>`;
        }
    }
</script>

<div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
<script>
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        let bgColor = 'bg-primary'; let icon = 'fa-info-circle';
        if (type === 'success') { bgColor = 'bg-green-600'; icon = 'fa-check-circle'; }
        else if (type === 'error') { bgColor = 'bg-red-600'; icon = 'fa-exclamation-circle'; }
        else if (type === 'warning') { bgColor = 'bg-accent'; icon = 'fa-exclamation-triangle'; }

        toast.className = `flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white ${bgColor} transform transition-all duration-300 translate-y-10 opacity-0`;
        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
        setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }
</script>

    window.authMode = 'login';
    
    window.toggleAuthMode = (mode) => {
        window.authMode = mode;
        const loginBtn = document.getElementById('tab-login');
        const regBtn = document.getElementById('tab-register');
        const submitBtn = document.getElementById('submit-btn');
        if (mode === 'login') {
            loginBtn.className = 'flex-1 px-4 py-2.5 text-sm font-bold bg-white text-primary rounded-md shadow transition';
            regBtn.className = 'flex-1 px-4 py-2.5 text-sm font-bold bg-transparent text-textSub hover:text-primary rounded-md transition';
            submitBtn.innerText = 'Email 登入';
        } else {
            regBtn.className = 'flex-1 px-4 py-2.5 text-sm font-bold bg-white text-primary rounded-md shadow transition';
            loginBtn.className = 'flex-1 px-4 py-2.5 text-sm font-bold bg-transparent text-textSub hover:text-primary rounded-md transition';
            submitBtn.innerText = '註冊帳號';
        }
    };

    window.togglePassword = (inputId, iconId) => {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    };

    window.handleEmailLogin = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submit-btn');
        const originalText = submitBtn.innerText;
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';
        
        try {
            const { auth } = window.AppState;
            const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.AuthAPI;
            
            if (window.authMode === 'login') {
                await signInWithEmailAndPassword(auth, email, password);
                showToast('登入成功！', 'success');
            } else {
                await createUserWithEmailAndPassword(auth, email, password);
                showToast('註冊成功！', 'success');
            }
            window.location.hash = '#/member';
        } catch (error) {
            let msg = '發生錯誤';
            if (error.code === 'auth/email-already-in-use') msg = '此 Email 已被註冊';
            else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') msg = '帳號或密碼錯誤';
            else if (error.code === 'auth/user-not-found') msg = '找不到此帳號，請先註冊';
            else if (error.code === 'auth/weak-password') msg = '密碼太弱，請至少輸入 6 個字元';
            showToast(msg, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = originalText;
        }
    };

    const router = () => {
        const root = document.getElementById('app-root');
        let path = window.location.hash.slice(1) || '/';
        
        root.classList.remove('page-enter');
        void root.offsetWidth;
        
        const isEmailAdmin = window.AppState.user && window.AppState.user.email === 'mindnodeai@gmail.com';
        
        if (path === '/' || path === '') {
            root.innerHTML = Views.home;
            setTimeout(window.loadHomeData, 100);
        } else if (path === '/articles') {
            root.innerHTML = Views.articles;
            setTimeout(async () => {
                await window.loadCategories('articles-category-filters', 'filters');
                window.fetchPublicArticles();
            }, 100);
        } else if (path.startsWith('/article/')) {
            const articleId = path.split('/')[2];
            root.innerHTML = Views.articleDetail;
            setTimeout(() => window.fetchArticleDetail(articleId), 100);
            window.scrollTo(0,0);
        } else if (path === '/ask-tony') {
            if (!window.AppState.user) {
                showToast("請先登入以使用 Ask TONY", "warning");
                window.location.hash = '#/login';
                return;
            }
            root.innerHTML = Views.askTony;
            window.scrollTo(0,0);
        } else if (path === '/series') {
            root.innerHTML = Views.series;
            setTimeout(window.loadSeriesData, 100);
            window.scrollTo(0,0);
        } else if (path === '/services' || path === '/courses') {
            root.innerHTML = Views.services;
            window.scrollTo(0,0);
        } else if (path === '/member') {
            if (!window.AppState.user) return window.location.hash = '#/login';
            root.innerHTML = Views.member;
            setTimeout(window.renderMemberDashboard, 100);
        } else if (path.startsWith('/admin')) {
            if (!window.AppState.user || (!['super_admin', 'admin'].includes(window.AppState.role) && !isEmailAdmin)) {
                return window.location.hash = '#/';
            }
            if (path === '/admin') { root.innerHTML = Views.admin; setTimeout(window.loadAdminDashboard, 100); }
            else if (path === '/admin/articles') { root.innerHTML = Views.adminArticles; setTimeout(window.loadAdminArticles, 100); }
            else if (path === '/admin/articles/new') { root.innerHTML = Views.adminArticleEdit; setTimeout(() => window.initArticleEditor(null), 100); }
            else if (path.startsWith('/admin/articles/edit/')) { 
                const articleId = path.split('/')[4]; 
                root.innerHTML = Views.adminArticleEdit; 
                setTimeout(() => window.initArticleEditor(articleId), 100); 
            }
            else if (path === '/admin/leads') { root.innerHTML = Views.adminLeads; setTimeout(window.loadAdminLeads, 100); }
            else if (path === '/admin/settings') { 
                root.innerHTML = Views.adminSettings; 
                setTimeout(() => { window.loadSiteSettings(); window.loadCategories('settings-categories-list', 'admin'); }, 100); 
            }
        } else if (path === '/login') {
            if (window.AppState.user) return window.location.hash = '#/member';
            root.innerHTML = Views.login;
        } else {
            root.innerHTML = `<div class="py-20 text-center"><h2 class="text-2xl font-bold">頁面不存在</h2></div>`;
        }

        root.classList.add('page-enter');
        if(!path.startsWith('/article/')) window.scrollTo(0,0);
    };

    window.loadHomeData = async () => {
        try {
            const { db } = window.AppState;
            const { doc, getDoc, collection, getDocs, query, where, orderBy, limit } = window.FS;
            const docSnap = await getDoc(doc(db, "settings", "global"));
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.heroTitle) document.getElementById('home-hero-title').innerHTML = data.heroTitle;
                if (data.heroBio) document.getElementById('home-hero-bio').innerHTML = data.heroBio;
                if (data.profileImageUrl) document.getElementById('home-profile-img').src = data.profileImageUrl;
                
                // 動態產生社群連結
                const socialContainer = document.getElementById('home-social-links');
                if (socialContainer) {
                    let socialHtml = '';
                    const renderSocialIcon = (url, iconClass) => {
                        if (url) return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-cta hover:text-white transition-all duration-300 shadow-sm border border-white/20 hover:scale-110"><i class="${iconClass}"></i></a>`;
                        return '';
                    };
                    socialHtml += renderSocialIcon(data.socialFb, 'fa-brands fa-facebook-f');
                    socialHtml += renderSocialIcon(data.socialLinkedin, 'fa-brands fa-linkedin-in');
                    socialHtml += renderSocialIcon(data.socialYt, 'fa-brands fa-youtube');
                    
                    if (socialHtml) {
                        socialContainer.innerHTML = socialHtml;
                        socialContainer.classList.remove('hidden');
                    } else {
                        socialContainer.classList.add('hidden');
                    }
                }

                // 動態更新前台 LOGO
                if (data.siteLogoUrl) {
                    const navLogo = document.getElementById('nav-logo-container');
                    if (navLogo) navLogo.innerHTML = `<img src="${data.siteLogoUrl}" alt="Logo" class="h-8 w-auto">`;
                    const footerLogo = document.getElementById('footer-logo-container');
                    if (footerLogo) footerLogo.innerHTML = `<img src="${data.siteLogoUrl}" alt="Logo" class="h-10 w-auto">`;
                }

                // 動態排版：專業里程碑 (深色微透明卡片、2欄式佈局、加倍行距、換行修正)
                const ipContainer = document.getElementById('home-ip-info-container');
                if (ipContainer && (data.skills || data.experience || data.certifications || data.books)) {
                    let ipHtml = '<div class="bg-white/10 backdrop-blur-md rounded-2xl p-8 md:p-10 border border-white/20 mt-12 mb-8 shadow-2xl">';
                    ipHtml += '<h3 class="text-3xl font-bold text-accent mb-8 flex items-center gap-3"><i class="fa-solid fa-address-card"></i> 專業里程碑</h3>';
                    
                    // 改為 2欄式佈局，加大間隔
                    ipHtml += '<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-12">';
                    
                    const renderBlock = (title, icon, content) => {
                        if (!content) return '';
                        // 修正換行 Bug：使用 \n 轉換
                        const formatted = content.replace(/\n/g, '<br>');
                        return `
                            <div class="bg-white/5 p-6 md:p-8 rounded-xl border border-white/10 hover:bg-white/10 transition duration-300">
                                <h4 class="text-accent font-bold text-lg md:text-xl mb-4 flex items-center gap-3 border-b border-white/10 pb-3">
                                    <i class="${icon}"></i> ${title}
                                </h4>
                                <p class="text-gray-200 text-sm md:text-base leading-loose tracking-wide">${formatted}</p>
                            </div>
                        `;
                    };
                    
                    ipHtml += renderBlock('核心專長', 'fa-solid fa-star', data.skills);
                    ipHtml += renderBlock('重要經歷', 'fa-solid fa-briefcase', data.experience);
                    ipHtml += renderBlock('企業輔導 / 人才認證', 'fa-solid fa-certificate', data.certifications);
                    ipHtml += renderBlock('專案主持與政府產業專案紀錄', 'fa-solid fa-book', data.books);
                    
                    ipHtml += '</div></div>';
                    ipContainer.innerHTML = ipHtml;
                }
            }
            
            // 動態載入首頁最新的 3 篇文章
            const featuredContainer = document.getElementById('home-featured-articles');
            if (featuredContainer) {
                const q = query(collection(db, "articles"), where("status", "==", "published"), where("visibility", "==", "public"), orderBy("createdAt", "desc"), limit(3));
                const snap = await getDocs(q);
                if (snap.empty) {
                    featuredContainer.innerHTML = '<div class="col-span-full py-12 text-center text-textSub">目前尚無文章。</div>';
                } else {
                    let html = '';
                    snap.forEach((doc) => {
                        const article = doc.data();
                        const dateStr = article.createdAt ? new Date(article.createdAt.seconds * 1000).toISOString().split('T')[0] : '剛剛發布';
                        const cover = article.coverImage || 'https://placehold.co/800x400/E2E8F0/64748B?text=TONY+STUDIO';
                        html += `
                            <div class="group bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col">
                                <div class="h-48 bg-gray-200 relative cursor-pointer" onclick="window.location.hash='#/article/${doc.id}'">
                                    <img src="${cover}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    <div class="absolute top-4 left-4 bg-primary text-white text-xs font-bold px-3 py-1 rounded shadow">${article.category || '未分類'}</div>
                                </div>
                                <div class="p-6 flex flex-col flex-grow">
                                    <p class="text-xs text-gray-400 mb-2"><i class="fa-regular fa-calendar mr-1"></i> ${dateStr}</p>
                                    <h3 class="text-xl font-bold text-textMain mb-3 cursor-pointer group-hover:text-cta transition line-clamp-2" onclick="window.location.hash='#/article/${doc.id}'">${article.title}</h3>
                                    <p class="text-sm text-textSub line-clamp-3 mb-6 flex-grow">${article.excerpt}</p>
                                    <a href="#/article/${doc.id}" class="text-cta text-sm font-bold flex items-center gap-1 mt-auto hover:text-blue-800">閱讀更多 <i class="fa-solid fa-arrow-right text-xs"></i></a>
                                </div>
                            </div>
                        `;
                    });
                    featuredContainer.innerHTML = html;
                }
            }
        } catch (error) { 
            console.warn("載入首頁失敗:", error); 
        }
    };

    window.loadSeriesData = async () => {
        const container = document.getElementById('series-list-container');
        if (!container) return;
        try {
            const { db } = window.AppState;
            const { collection, getDocs, query, where, orderBy } = window.FS;
            const catSnap = await getDocs(query(collection(db, "categories"), orderBy("order", "asc")));
            
            if (catSnap.empty) { container.innerHTML = '<div class="col-span-full py-12 text-center text-textSub">目前無分類。</div>'; return; }
            let html = '';
            for (const doc of catSnap.docs) {
                const cat = doc.data();
                try {
                    const artSnap = await getDocs(query(collection(db, "articles"), where("category", "==", cat.name), where("status", "==", "published"), where("visibility", "==", "public"), orderBy("createdAt", "desc")));
                    if (artSnap.size > 0) {
                        const coverUrl = artSnap.docs[0].data().coverImage || 'https://placehold.co/800x400/E2E8F0/64748B?text=' + encodeURIComponent(cat.name);
                        html += `
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden group flex flex-col">
                                <div class="h-48 bg-gray-200 relative overflow-hidden cursor-pointer" onclick="window.filterArticles('${cat.name}'); window.location.hash='#/articles';">
                                    <img src="${coverUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    <div class="absolute top-4 left-4 bg-accent text-primary text-xs font-bold px-3 py-1 rounded">專題</div>
                                </div>
                                <div class="p-8 flex flex-col flex-grow">
                                    <h3 class="text-2xl font-bold text-primary mb-3">${cat.name}</h3>
                                    <p class="text-textSub mb-6 flex-grow">探索所有關於「${cat.name}」的深度解析與實戰經驗。</p>
                                    <div class="flex items-center justify-between mt-auto">
                                        <span class="text-sm text-gray-500"><i class="fa-solid fa-list-ol mr-1"></i> 共 ${artSnap.size} 篇文章</span>
                                        <button onclick="window.filterArticles('${cat.name}'); window.location.hash='#/articles';" class="text-cta font-medium hover:underline">開始閱讀 <i class="fa-solid fa-arrow-right text-sm ml-1"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } catch (e) {
                    if (e.code === 'failed-precondition') {
                        container.innerHTML = `<div class="col-span-full py-12 text-center text-red-500 bg-red-50 rounded-lg p-6 border border-red-200"><i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i><br><b>需要建立複合索引</b><br>請按鍵盤 <kbd>F12</kbd> 打開開發者工具，點擊 Console 內的藍色連結建立索引。</div>`;
                        return;
                    }
                }
            }
            container.innerHTML = html || '<div class="col-span-full py-12 text-center text-textSub">專題下無文章。</div>';
        } catch (error) {
            container.innerHTML = '<div class="col-span-full text-center">載入失敗。</div>';
        }
    };

            document.getElementById('member-name').innerText = user.displayName || user.email.split('@')[0];
            document.getElementById('member-email').innerText = user.email;
            document.getElementById('member-avatar').src = user.photoURL || 'https://placehold.co/100x100?text=' + user.email.charAt(0).toUpperCase();
        }
    };

    window.fetchPublicArticles = async () => {
        const container = document.getElementById('articles-list-container');
        if (!container) return;
        try {
            const currentCat = window.AppState.currentCategory || '全部';
            const { db } = window.AppState; const { collection, getDocs, query, where, orderBy } = window.FS;
            let constraints = [where("status", "==", "published"), where("visibility", "==", "public")];
            if (currentCat !== '全部') constraints.push(where("category", "==", currentCat));
            constraints.push(orderBy("createdAt", "desc"));
            
            const q = query(collection(db, "articles"), ...constraints);
            const snap = await getDocs(q);
            if (snap.empty) { container.innerHTML = '<div class="col-span-full py-12 text-center text-textSub">目前無文章。</div>'; return; }
            let html = '';
            snap.forEach((doc) => {
                const article = doc.data();
                html += `
                    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col cursor-pointer" onclick="window.location.hash='#/article/${doc.id}'">
                        <img src="${article.coverImage || 'https://placehold.co/800x400'}" class="h-48 w-full object-cover">
                        <div class="p-6"><h3 class="text-xl font-bold mb-2">${article.title}</h3><p class="text-sm text-gray-600 line-clamp-2">${article.excerpt}</p></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch(e) { container.innerHTML = '<div class="col-span-full text-center text-red-500">讀取失敗</div>'; }
    };

    window.fetchArticleDetail = async (id) => {
        try {
            const { db } = window.AppState; const { doc, getDoc } = window.FS;
            const docSnap = await getDoc(doc(db, "articles", id));
            if (docSnap.exists()) {
                const article = docSnap.data();
                document.getElementById('detail-title').innerText = article.title;
                document.getElementById('detail-category').innerText = article.category || '未分類';
                document.getElementById('detail-cover').src = article.coverImage || 'https://placehold.co/800x400';
                document.getElementById('detail-content').innerHTML = article.content || '';
                window.updateSEO(article.title, article.excerpt, article.coverImage);
            }
        } catch(e) { document.getElementById('detail-content').innerHTML = '讀取失敗'; }
    };

    window.loadAdminDashboard = async () => {
        try {
            const { db } = window.AppState; const { collection, getDocs, query, orderBy, limit } = window.FS;
            const snap = await getDocs(query(collection(db, "subscribers"), orderBy("timestamp", "desc"), limit(10)));
            const container = document.getElementById('admin-subscribers-list');
            if (snap.empty) { container.innerHTML = '<tr><td colspan="2" class="text-center py-4">無訂閱者</td></tr>'; return; }
            let html = '';
            snap.forEach(d => {
                const data = d.data();
                html += `<tr><td class="px-6 py-4 border-b">${new Date(data.timestamp?.seconds*1000).toLocaleDateString()}</td><td class="px-6 py-4 border-b">${data.email}</td></tr>`;
            });
            container.innerHTML = html;
        } catch(e) {}
    };

    window.loadAdminLeads = async () => {
        try {
            const { db } = window.AppState; const { collection, getDocs, query, orderBy, limit } = window.FS;
            const snap = await getDocs(query(collection(db, "leads"), orderBy("createdAt", "desc"), limit(20)));
            const container = document.getElementById('admin-leads-list');
            if (snap.empty) { container.innerHTML = '<tr><td colspan="2" class="text-center py-4">無商機資料</td></tr>'; return; }
            let html = '';
            snap.forEach(d => {
                const data = d.data();
                html += `<tr><td class="px-6 py-4 border-b">${new Date(data.createdAt?.seconds*1000).toLocaleDateString()}</td><td class="px-6 py-4 border-b">${data.name} <br><span class="text-xs text-gray-500">${data.email}</span></td></tr>`;
            });
            container.innerHTML = html;
        } catch(e) {}
    };

    window.loadAdminArticles = async () => {
        const container = document.getElementById('admin-articles-list');
        try {
            const { db } = window.AppState; const { collection, getDocs, query, orderBy } = window.FS;
            const snap = await getDocs(query(collection(db, "articles"), orderBy("createdAt", "desc")));
            if (snap.empty) { container.innerHTML = '<tr><td colspan="4" class="text-center py-4">無文章</td></tr>'; return; }
            let html = '';
            snap.forEach(d => {
                const data = d.data();
                html += `
                    <tr>
                        <td class="px-6 py-4 border-b"><p class="font-bold text-primary">${data.title}</p><span class="text-xs bg-gray-100 px-2 py-1 rounded">${data.category}</span></td>
                        <td class="px-6 py-4 border-b">${data.status === 'published' ? '<span class="text-green-600 font-bold text-xs">已發布</span>' : '<span class="text-gray-400 font-bold text-xs">草稿</span>'}</td>
                        <td class="px-6 py-4 border-b text-sm">${new Date(data.createdAt?.seconds*1000).toLocaleDateString()}</td>
                        <td class="px-6 py-4 border-b text-right">
                            <a href="#/admin/articles/edit/${d.id}" class="text-blue-500 hover:underline mr-3 text-sm">編輯</a>
                            <button onclick="window.deleteArticle('${d.id}')" class="text-red-500 hover:underline text-sm">刪除</button>
                        </td>
                    </tr>
                `;
            });
            container.innerHTML = html;
        } catch(e) {}
    };

    window.initArticleEditor = async (id) => {
        document.getElementById('article-id').value = id || '';
        document.getElementById('editor-title').innerHTML = id ? '編輯文章' : '新增文章';
        if (window.quillEditor) window.quillEditor = null;
        window.quillEditor = new Quill('#editor-container', { theme: 'snow', modules: { toolbar: [ [{ 'header': [1, 2, false] }], ['bold', 'italic'], ['clean'] ] } });
        
        await window.loadCategories('article-category-input', 'select');

        if (id) {
            const { db } = window.AppState; const { doc, getDoc } = window.FS;
            const docSnap = await getDoc(doc(db, "articles", id));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('article-title-input').value = data.title || '';
                document.getElementById('article-excerpt-input').value = data.excerpt || '';
                document.getElementById('article-status-input').value = data.status || 'draft';
                if(data.coverImage) document.getElementById('cover-preview-img').src = data.coverImage;
                if(data.category) document.getElementById('article-category-input').value = data.category;
                if(data.content) window.quillEditor.clipboard.dangerouslyPasteHTML(data.content);
            }
        }
    };

    window.saveArticle = async (e) => {
        e.preventDefault();
        const id = document.getElementById('article-id').value;
        const title = document.getElementById('article-title-input').value;
        const excerpt = document.getElementById('article-excerpt-input').value;
        const content = window.quillEditor.root.innerHTML;
        const status = document.getElementById('article-status-input').value;
        const category = document.getElementById('article-category-input').value;
        const coverImage = document.getElementById('article-cover-input').value || document.getElementById('cover-preview-img').src;
        
        if(!title) return showToast("請輸入標題", "warning");

        const { db } = window.AppState; const { collection, doc, addDoc, updateDoc, serverTimestamp } = window.FS;
        const data = { title, excerpt, content, status, category, coverImage, visibility: 'public', updatedAt: serverTimestamp() };
        
        try {
            if (id) { await updateDoc(doc(db, "articles", id), data); showToast("更新成功", "success"); } 
            else { data.createdAt = serverTimestamp(); await addDoc(collection(db, "articles"), data); showToast("新增成功", "success"); }
            setTimeout(() => window.location.hash = '#/admin/articles', 1000);
        } catch(err) { showToast("儲存失敗", "error"); }
    };

    window.deleteArticle = (id) => {
        window.showModal('刪除文章', '確定要刪除這篇文章嗎？此動作無法復原。', async () => {
            try {
                const { db } = window.AppState; const { doc, deleteDoc } = window.FS;
                await deleteDoc(doc(db, "articles", id));
                showToast("文章已刪除", "success");
                window.loadAdminArticles();
            } catch(e) { showToast("刪除失敗", "error"); }
        }, '確定刪除', true);
    };

    window.submitAskTony = async (e) => {
        e.preventDefault();
        const input = document.getElementById('ask-tony-input');
        const btn = document.getElementById('ask-tony-btn');
        const chatbox = document.getElementById('ask-tony-chatbox');
        const question = input.value.trim();
        if (!question) return;

        chatbox.innerHTML += `
            <div class="flex gap-4 justify-end">
                <div class="bg-cta text-white px-5 py-3 rounded-2xl rounded-tr-sm shadow-sm max-w-[80%]">${question.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
            </div>
        `;
        input.value = '';
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        chatbox.scrollTop = chatbox.scrollHeight;

        const loadingId = 'ai-msg-' + Date.now();
        chatbox.innerHTML += `
            <div class="flex gap-4" id="${loadingId}">
                <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-accent font-bold shadow-sm flex-shrink-0">T</div>
                <div class="bg-white px-5 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 text-textSub max-w-[80%]"><i class="fa-solid fa-ellipsis fa-fade"></i> AI 顧問思考中...</div>
            </div>
        `;
        chatbox.scrollTop = chatbox.scrollHeight;

        try {
            if (!window.AppState.user) throw new Error("請先登入會員，才能與 Ask TONY 對話喔！");
            const { functions } = window.AppState; const { httpsCallable } = window.FunctionsAPI;
            const askTonyCloud = httpsCallable(functions, 'askTony');
            
            const result = await askTonyCloud({ query: question, contextText: "這是 TONY 知識庫提供的內容。" });
            
            document.getElementById(loadingId).innerHTML = `
                <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-accent font-bold shadow-sm flex-shrink-0">T</div>
                <div class="bg-white px-5 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 text-textMain max-w-[80%] prose prose-sm leading-relaxed">${result.data.text.replace(/\n/g, '<br>')}</div>
            `;
        } catch (error) {
            let errorMsg = error.message || "抱歉，連線發生錯誤。";
            document.getElementById(loadingId).innerHTML = `
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-500 font-bold shadow-sm flex-shrink-0"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="bg-red-50 px-5 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-red-100 text-red-600 max-w-[80%]">${errorMsg}</div>
            `;
            if (errorMsg.includes('登入')) setTimeout(() => window.location.hash = '#/login', 2000);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane text-lg"></i>';
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    };

    window.generateAIContent = async () => {
        const prompt = document.getElementById('ai-prompt').value;
        if (!prompt) return showToast("請輸入寫作主題", "warning");
        try {
            showToast("AI 撰寫中...", "info");
            const { functions } = window.AppState; const { httpsCallable } = window.FunctionsAPI;
            const aiAssistantCloud = httpsCallable(functions, 'aiAssistant');
            const result = await aiAssistantCloud({ prompt: prompt, style: "專業技術", audience: "工程師" });
            window.quillEditor.clipboard.dangerouslyPasteHTML(window.quillEditor.getLength(), result.data.html);
            showToast("生成完成", "success");
        } catch(e) { showToast("生成失敗", "error"); }
    };

    window.generateCoverPrompt = async () => {
        const prompt = document.getElementById('ai-prompt').value;
        if (!prompt) return showToast("請輸入寫作主題", "warning");
        try {
            showToast("AI 設計提示詞中...", "info");
            const { functions } = window.AppState; const { httpsCallable } = window.FunctionsAPI;
            const aiImagePromptCloud = httpsCallable(functions, 'aiImagePrompt');
            const result = await aiImagePromptCloud({ prompt: prompt });
            document.getElementById('ai-prompt-result-container').classList.remove('hidden');
            document.getElementById('ai-cover-prompt-result').value = result.data.prompt;
            showToast("Prompt 已生成", "success");
        } catch(e) { showToast("生成失敗", "error"); }
    };

    window.previewImage = async (event, previewId) => {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById(previewId).src = e.target.result;
            reader.readAsDataURL(file);
            
            try {
                showToast("上傳圖片中...", "info");
                const { storage } = window.AppState; const { ref, uploadBytes, getDownloadURL } = window.StorageAPI;
                const storageRef = ref(storage, `site/${Date.now()}_${file.name}`);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);
                
                if (previewId === 'settings-logo-preview') { document.getElementById('hidden-site-logo').value = url; } 
                else if (previewId === 'settings-preview-img') { document.getElementById('hidden-profile-img').value = url; }
                else if (previewId === 'cover-preview-img') { document.getElementById('article-cover-input').value = url; }
                showToast("圖片上傳雲端成功", "success");
            } catch (err) { showToast("上傳失敗", "error"); }
        }
    };

    window.loadSiteSettings = async () => {
        try {
            const { db } = window.AppState; const { doc, getDoc } = window.FS;
            const docSnap = await getDoc(doc(db, "settings", "global"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.heroTitle) document.getElementById('settings-hero-title').value = data.heroTitle;
                if (data.heroBio) document.getElementById('settings-hero-bio').value = data.heroBio;
                if (data.skills) document.getElementById('settings-skills').value = data.skills;
                if (data.experience) document.getElementById('settings-experience').value = data.experience;
                if (data.certifications) document.getElementById('settings-certifications').value = data.certifications;
                if (data.books) document.getElementById('settings-books').value = data.books;
                
                if (data.socialFb) document.getElementById('settings-social-fb').value = data.socialFb;
                if (data.socialLinkedin) document.getElementById('settings-social-linkedin').value = data.socialLinkedin;
                if (data.socialYt) document.getElementById('settings-social-yt').value = data.socialYt;
                
                if (data.siteLogoUrl) {
                    document.getElementById('settings-logo-preview').src = data.siteLogoUrl;
                    document.getElementById('hidden-site-logo').value = data.siteLogoUrl;
                }
                if (data.profileImageUrl) {
                    document.getElementById('settings-preview-img').src = data.profileImageUrl;
                    document.getElementById('hidden-profile-img').value = data.profileImageUrl;
                }
            }
        } catch(e) { }
    };

    window.saveSiteSettings = async (e) => {
        e.preventDefault();
        try {
            const { db } = window.AppState; const { doc, setDoc, serverTimestamp } = window.FS;
            const data = {
                heroTitle: document.getElementById('settings-hero-title').value,
                heroBio: document.getElementById('settings-hero-bio').value,
                skills: document.getElementById('settings-skills').value,
                experience: document.getElementById('settings-experience').value,
                certifications: document.getElementById('settings-certifications').value,
                books: document.getElementById('settings-books').value,
                socialFb: document.getElementById('settings-social-fb').value || '',
                socialLinkedin: document.getElementById('settings-social-linkedin').value || '',
                socialYt: document.getElementById('settings-social-yt').value || '',
                siteLogoUrl: document.getElementById('hidden-site-logo').value || '',
                profileImageUrl: document.getElementById('hidden-profile-img').value || '',
                updatedAt: serverTimestamp()
            };
            await setDoc(doc(db, "settings", "global"), data, { merge: true });
            showToast("全域設定已儲存！", "success");
            
            if (data.siteLogoUrl) {
                const navLogo = document.getElementById('nav-logo-container');
                if (navLogo) navLogo.innerHTML = `<img src="${data.siteLogoUrl}" alt="Logo" class="h-8 w-auto">`;
                const footerLogo = document.getElementById('footer-logo-container');
                if (footerLogo) footerLogo.innerHTML = `<img src="${data.siteLogoUrl}" alt="Logo" class="h-10 w-auto">`;
            }
        } catch(err) { showToast("儲存失敗", "error"); }
    };

    window.loadCategories = async (containerId, mode = 'filters') => {
        const container = document.getElementById(containerId);
        if(!container) return;
        try {
            const { db } = window.AppState; const { collection, getDocs, query, orderBy } = window.FS;
            const snap = await getDocs(query(collection(db, "categories"), orderBy("order", "asc")));
            
            if (mode === 'admin') {
                let html = '';
                snap.forEach(doc => { html += `<div class="bg-gray-50 px-4 py-3 rounded border font-medium flex justify-between items-center">${doc.data().name} <button onclick="window.deleteCategory('${doc.id}')" class="text-red-500 hover:text-red-700 text-sm"><i class="fa-solid fa-trash"></i></button></div>`; });
                container.innerHTML = html;
            } else if (mode === 'select') {
                let html = '';
                snap.forEach(doc => { html += `<option value="${doc.data().name}">${doc.data().name}</option>`; });
                container.innerHTML = html;
            } else if (mode === 'filters') {
                let html = `<button onclick="window.filterArticles('全部')" class="cat-btn px-5 py-2 bg-primary text-white rounded-full text-sm">全部</button>`;
                snap.forEach(doc => { html += `<button onclick="window.filterArticles('${doc.data().name}')" class="cat-btn px-5 py-2 bg-white border rounded-full text-sm">${doc.data().name}</button>`; });
                container.innerHTML = html;
            }
        } catch(e) {}
    };

    window.createCategory = async () => {
        const name = document.getElementById('new-category-input').value.trim();
        if(!name) return;
        try {
            const { db } = window.AppState; const { collection, addDoc, serverTimestamp } = window.FS;
            await addDoc(collection(db, "categories"), { name: name, order: Date.now(), createdAt: serverTimestamp() });
            showToast("新增分類成功", "success");
            document.getElementById('new-category-input').value = '';
            window.loadCategories('settings-categories-list', 'admin');
        } catch(e) { showToast("新增失敗", "error"); }
    };
    
    window.deleteCategory = (id) => {
        window.showModal('刪除分類', '確定要刪除這個分類嗎？', async () => {
            try {
                const { db } = window.AppState; const { doc, deleteDoc } = window.FS;
                await deleteDoc(doc(db, "categories", id));
                showToast("分類已刪除", "success");
                window.loadCategories('settings-categories-list', 'admin');
            } catch(e) { showToast("刪除失敗", "error"); }
        }, '確定刪除', true);
    };

    window.filterArticles = (category) => {
        window.AppState.currentCategory = category;
        window.fetchPublicArticles();
        document.querySelectorAll('.cat-btn').forEach(btn => {
            if(btn.innerText === category) { btn.className = 'cat-btn px-5 py-2 bg-primary text-white shadow-md text-sm font-medium rounded-full whitespace-nowrap transition'; }
            else { btn.className = 'cat-btn px-5 py-2 bg-white text-textSub border border-gray-200 hover:border-cta hover:text-cta text-sm font-medium rounded-full whitespace-nowrap transition'; }
        });
    };

    window.addEventListener('hashchange', router);
    window.addEventListener('load', () => { router(); });
</script>

</body>
</html>
