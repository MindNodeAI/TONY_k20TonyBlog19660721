    window.FS = {
        collection, getDocs, getDoc, doc, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp
    };

    // Make Auth functions globally available for inline event handlers (though we prefer event listeners)
    window.handleEmailRegister = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if(!email || !password) {
            showToast("請輸入信箱與密碼", "warning");
            return;
        }

        try {
            await createUserWithEmailAndPassword(auth, email, password);
            showToast("註冊成功！", "success");
            window.location.hash = '#/member';
        } catch (error) {
            console.error("Registration failed", error);
            // 處理常見錯誤
            if (error.code === 'auth/email-already-in-use') {
                showToast("此信箱已註冊過，請改用登入", "error");
            } else if (error.code === 'auth/weak-password') {
                showToast("密碼太弱，至少需要 6 個字元", "warning");
            } else {
                showToast("註冊失敗：" + error.message, "error");
            }
        }
    };

    window.handleEmailLogin = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!email || !password) {
            showToast("請輸入信箱與密碼", "warning");
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
            showToast("登入成功！", "success");
            window.location.hash = '#/member';
        } catch (error) {
            console.error("Login failed", error);
             if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                showToast("帳號或密碼錯誤", "error");
            } else {
                showToast("登入失敗：" + error.message, "error");
            }
        }
    };

    // 保留沙盒登入作為備用
    window.handleLogin = async () => {
        try {
            // 在沙盒環境中，繞過 Google Popup 限制，改用 Custom Token 或匿名登入進行測試
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            showToast("已透過沙盒測試環境成功登入", "success");
            window.location.hash = '#/';
        } catch (error) {
            console.error("Login failed", error);
            showToast("登入失敗，請稍後再試。 (" + error.message + ")", "error");
        }
    };

    window.handleLogout = async () => {
        try {
            await signOut(auth);
            window.AppState.role = null; // 清除 role
            showToast("已成功登出", "success");
            window.location.hash = '#/';
        } catch (error) {
            console.error("Logout failed", error);
        }
    };

    // 處理登入/註冊分頁切換 (移至全域)
    window.toggleAuthMode = (mode) => {
        const form = document.getElementById('auth-form');
        const btn = document.getElementById('submit-btn');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        
        if (!form || !btn || !tabLogin || !tabRegister) return;
        
        if(mode === 'login') {
            form.onsubmit = window.handleEmailLogin;
            btn.innerText = 'Email 登入';
            tabLogin.classList.replace('bg-white', 'bg-primary');
            tabLogin.classList.replace('text-primary', 'text-white');
            tabRegister.classList.replace('bg-primary', 'bg-white');
            tabRegister.classList.replace('text-white', 'text-primary');
        } else {
            form.onsubmit = window.handleEmailRegister;
            btn.innerText = '註冊新帳號';
            tabRegister.classList.replace('bg-white', 'bg-primary');
            tabRegister.classList.replace('text-primary', 'text-white');
            tabLogin.classList.replace('bg-primary', 'bg-white');
            tabLogin.classList.replace('text-white', 'text-primary');
        }
    };

    // Listen to Auth State
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // 強制刷新 Token 以獲取剛才後端賦予的 Custom Claims (super_admin)
            const idTokenResult = await user.getIdTokenResult(true);
            window.AppState.role = idTokenResult.claims.role || 'member';
            window.AppState.user = user;
            updateNavbarAuthUI(user, window.AppState.role);
        } else {
            window.AppState.user = null;
            window.AppState.role = null;
            updateNavbarAuthUI(null, null);
        }
    });

    function updateNavbarAuthUI(user, role) {
        const authContainer = document.getElementById('nav-auth-container');
        if (!authContainer) return;

        if (user) {
            const displayName = user.displayName || user.email?.split('@')[0] || '會員';
            const avatarUrl = user.photoURL || ('https://placehold.co/100x100/163A63/FFF?text=' + displayName.charAt(0).toUpperCase());
            
            // 如果是管理員，顯示後台入口
            const adminLink = (role === 'super_admin' || role === 'admin') 
                ? `<a href="#/admin" class="text-xs font-bold text-accent bg-secondary px-2 py-1 rounded hover:bg-primary transition"><i class="fa-solid fa-gauge mr-1"></i>管理後台</a>` 
                : '';

            authContainer.innerHTML = `
                <div class="flex items-center space-x-4">
                    ${adminLink}
                    <a href="#/member" class="flex items-center space-x-2 text-textSub hover:text-primary transition">
                        <img src="${avatarUrl}" alt="Avatar" class="w-8 h-8 rounded-full border border-gray-200">
                        <span class="text-sm font-medium hidden sm:block">${displayName}</span>
                    </a>
                    <button onclick="window.handleLogout()" class="text-sm text-textSub hover:text-red-600 transition">登出</button>
                </div>
            `;
        } else {
            authContainer.innerHTML = `
                <a href="#/login" class="px-5 py-2 text-sm font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>
            `;
        }
    }
</script>

<script>
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        
        let bgColor = 'bg-primary';
        let icon = 'fa-info-circle';
        
        if (type === 'success') { bgColor = 'bg-green-600'; icon = 'fa-check-circle'; }
        else if (type === 'error') { bgColor = 'bg-red-600'; icon = 'fa-exclamation-circle'; }
        else if (type === 'warning') { bgColor = 'bg-accent'; icon = 'fa-exclamation-triangle'; }

        toast.className = `flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white ${bgColor} transform transition-all duration-300 translate-y-10 opacity-0`;
        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
        
        container.appendChild(toast);
        
        // Trigger reflow for animation
        setTimeout(() => {
            toast.classList.remove('translate-y-10', 'opacity-0');
        }, 10);

        setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
</script>

    };

    // --- In-Memory State for Interactive Features ---
    window.UserInteractions = {
        bookmarks: new Set(),
        currentArticleId: null
    };

    // --- Router Implementation ---
    function router() {
        const root = document.getElementById('app-root');
        let path = window.location.hash.slice(1) || '/';
        
        // Remove animation class briefly to trigger re-flow
        root.classList.remove('page-enter');
        void root.offsetWidth; // trigger reflow
        
        if (path === '/' || path === '') {
            root.innerHTML = Views.home;
            setTimeout(window.fetchHomeLatestArticles, 100); // 載入首頁最新文章
        } else if (path === '/articles') {
            root.innerHTML = Views.articles;
            setTimeout(window.fetchPublicArticles, 100); 
        } else if (path.startsWith('/article/')) {
            const articleId = path.split('/')[2];
            window.UserInteractions.currentArticleId = articleId;
            root.innerHTML = Views.articleDetail;
            setTimeout(() => window.fetchArticleDetail(articleId), 100);
            window.scrollTo(0,0);
        } else if (path === '/ask-tony') {
            if (!window.AppState.user) {
                showToast("請先登入以使用 Ask TONY", "warning");
                window.location.hash = '#/login';
                return;
            }
            root.innerHTML = Views.askTony;
            window.scrollTo(0,0);
        } else if (path === '/services') {
            root.innerHTML = Views.services;
            window.scrollTo(0,0);
        } else if (path === '/about') {
            root.innerHTML = Views.about;
            window.scrollTo(0,0);
        } else if (path === '/contact') {
            root.innerHTML = Views.contact;
            window.scrollTo(0,0);
        } else if (path === '/member') {
            if (!window.AppState.user) {
                showToast("請先登入以查看會員專區", "warning");
                window.location.hash = '#/login';
                return;
            }
            root.innerHTML = Views.member;
            setTimeout(renderMemberDashboard, 100);
        } else if (path === '/admin') {
            if (!window.AppState.user || !['super_admin', 'admin'].includes(window.AppState.role)) {
                showToast("無權限訪問，請確認您已設定超級管理員權限", "error");
                window.location.hash = '#/';
                return;
            }
            root.innerHTML = Views.admin;
        } else if (path === '/admin/articles') {
            if (!window.AppState.user || !['super_admin', 'admin', 'editor'].includes(window.AppState.role)) return;
            root.innerHTML = Views.adminArticles;
            setTimeout(window.loadAdminArticles, 100);
        } else if (path === '/admin/articles/new') {
            if (!window.AppState.user || !['super_admin', 'admin', 'editor'].includes(window.AppState.role)) return;
            root.innerHTML = Views.adminArticleEdit;
            setTimeout(() => window.initArticleEditor(null), 100);
        } else if (path.startsWith('/admin/articles/edit/')) {
            if (!window.AppState.user || !['super_admin', 'admin', 'editor'].includes(window.AppState.role)) return;
            const articleId = path.split('/')[4];
            root.innerHTML = Views.adminArticleEdit;
            setTimeout(() => window.initArticleEditor(articleId), 100);
        } else if (path === '/login') {
            if (window.AppState.user) {
                window.location.hash = '#/member'; // Redirect if already logged in
                return;

            root.innerHTML = Views.login;

    // --- Data Fetching & Rendering Logic (Real Firestore) ---
    
    window.filterArticles = (category) => {
        window.AppState.currentCategory = category;
        // 更新按鈕樣式
        document.querySelectorAll('.cat-btn').forEach(btn => {
            if (btn.dataset.cat === category) {
                btn.className = 'cat-btn px-4 py-1.5 bg-primary text-white text-sm font-medium rounded-full whitespace-nowrap transition';
            } else {
                btn.className = 'cat-btn px-4 py-1.5 bg-bg text-textSub hover:bg-gray-200 text-sm font-medium rounded-full whitespace-nowrap transition';
            }
        });
        window.fetchPublicArticles();
    };

    window.searchArticles = (event) => {
        // 簡單的防抖 (Debounce) 與 Enter 觸發
        if (event.key === 'Enter' || event.target.value.length === 0 || event.target.value.length > 2) {
            window.AppState.searchQuery = event.target.value.toLowerCase();
            window.fetchPublicArticles();
        }
    };
    
    window.fetchPublicArticles = async () => {
        const container = document.getElementById('articles-list-container');
        if (!container) return;
        container.innerHTML = '<div class="col-span-full py-12 text-center"><i class="fa-solid fa-spinner fa-spin text-3xl text-cta mb-4"></i></div>';
        
        try {
            // [修正] 加入預設值 ('全部' 與 '')，避免初始載入時為 undefined 導致 Firestore 報錯
            const currentCategory = window.AppState.currentCategory || '全部';
            const searchQuery = window.AppState.searchQuery || '';
            const { db } = window.AppState;
            const { collection, getDocs, query, where, orderBy } = window.FS;
            
            // 基礎查詢：已發布 + 公開
            let constraints = [
                where("status", "==", "published"),
                where("visibility", "==", "public")
            ];
            
            // 分類篩選
            if (currentCategory !== '全部') {
                constraints.push(where("category", "==", currentCategory));
            }
            constraints.push(orderBy("createdAt", "desc"));
            
            const q = query(collection(db, "articles"), ...constraints);
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                container.innerHTML = '<div class="col-span-full py-12 text-center text-textSub">目前還沒有符合條件的文章喔。</div>';
                return;
            }

            let html = '';
            let renderCount = 0;

            querySnapshot.forEach((doc) => {
                const article = doc.data();
                
                // 客戶端關鍵字搜尋 (因為 Firestore 不支援原生全文檢索，V1 採用前端過濾)
                if (searchQuery) {
                    const title = (article.title || '').toLowerCase();
                    const excerpt = (article.excerpt || '').toLowerCase();
                    if (!title.includes(searchQuery) && !excerpt.includes(searchQuery)) return;
                }

                renderCount++;
                const dateStr = article.createdAt ? new Date(article.createdAt.seconds * 1000).toISOString().split('T')[0] : '剛剛發布';
                const cover = article.coverImage || 'https://placehold.co/800x400/E2E8F0/64748B?text=TONY+STUDIO';
                
                html += `
                    <div class="group bg-white rounded-lg border border-gray-200 overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col">
                        <div class="h-48 bg-gray-200 relative overflow-hidden cursor-pointer" onclick="window.location.hash='#/article/${doc.id}'">
                            <img src="${cover}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="Cover">
                            <div class="absolute top-4 left-4 bg-primary text-white text-xs font-bold px-3 py-1 rounded shadow">${article.category || '未分類'}</div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex items-center text-xs text-textSub mb-3 gap-4">
                                <span><i class="fa-regular fa-calendar mr-1"></i> ${dateStr}</span>
                            </div>
                            <h3 class="text-xl font-bold text-textMain mb-3 group-hover:text-cta transition line-clamp-2 cursor-pointer" onclick="window.location.hash='#/article/${doc.id}'">${article.title}</h3>
                            <p class="text-sm text-textSub line-clamp-3 mb-6 flex-grow">${article.excerpt}</p>
                            <a href="#/article/${doc.id}" class="text-cta text-sm font-bold flex items-center gap-1 hover:text-blue-800 mt-auto">
                                閱讀更多 <i class="fa-solid fa-arrow-right text-xs"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = renderCount > 0 ? html : '<div class="col-span-full py-12 text-center text-textSub">沒有找到符合關鍵字的文章。</div>';
        } catch (error) {
            console.error("Fetch error:", error);
            container.innerHTML = '<div class="col-span-full py-12 text-center text-red-500"><i class="fa-solid fa-triangle-exclamation mr-2"></i>載入文章時發生錯誤，請稍後再試。</div>';
        }
    };

    window.fetchArticleDetail = async (id) => {
        try {
            const { db } = window.AppState;
            const { doc, getDoc } = window.FS;
            const docSnap = await getDoc(doc(db, "articles", id));

            if (!docSnap.exists()) {
                document.getElementById('detail-title').innerText = '文章不存在或已下架';
                document.getElementById('detail-content').innerHTML = '<p class="text-center text-textSub py-12">找不到此文章的內容。</p>';
                return;
            }

            const article = docSnap.data();
            const dateStr = article.createdAt ? new Date(article.createdAt.seconds * 1000).toISOString().split('T')[0] : '剛剛發布';
            
            document.getElementById('detail-title').innerText = article.title;
            document.getElementById('detail-category').innerText = article.category || '未分類';
            document.getElementById('detail-date').innerHTML = `<i class="fa-regular fa-calendar mr-1"></i> ${dateStr}`;
            document.getElementById('detail-cover').src = article.coverImage || 'https://placehold.co/1200x600/E2E8F0/64748B?text=Article+Cover';
            
            // 渲染真實內容
            document.getElementById('detail-content').innerHTML = article.content || '<p class="text-textSub">尚無詳細內容。</p>';
            
            // 檢查是否已收藏
            window.updateBookmarkButtonUI(id);
            
        } catch (error) {
            console.error("Fetch detail error:", error);
            document.getElementById('detail-title').innerText = '無權限檢視';
            document.getElementById('detail-content').innerHTML = '<p class="text-center text-red-500 py-12">這可能是一篇草稿，您必須擁有管理員權限才能檢視。</p>';
        }
    };

    // 真實 Firestore 收藏功能
    window.toggleBookmark = async () => {
        const { user, db } = window.AppState;
        if (!user) {
            showToast('請先登入才能收藏文章', 'warning');
            window.location.hash = '#/login';
            return;
        }

        const articleId = window.UserInteractions.currentArticleId;
        if (!articleId) return;

        const { doc, setDoc, deleteDoc, getDoc, serverTimestamp } = window.FS;
        const bookmarkRef = doc(db, "users", user.uid, "bookmarks", articleId);
        
        try {
            const docSnap = await getDoc(bookmarkRef);
            const btn = document.getElementById('btn-bookmark');
            
            if (docSnap.exists()) {
                // 已收藏 -> 取消收藏
                await deleteDoc(bookmarkRef);
                showToast('已取消收藏', 'info');
                if (btn) btn.className = 'w-10 h-10 rounded-full bg-secondary hover:bg-white hover:text-primary transition flex items-center justify-center text-white shadow-sm';
            } else {
                // 未收藏 -> 加入收藏
                // 抓取文章當下資料一併存入，方便在會員中心顯示 (Denormalization)
                const articleTitle = document.getElementById('detail-title').innerText;
                const articleCategory = document.getElementById('detail-category').innerText;
                
                await setDoc(bookmarkRef, {
                    articleId: articleId,
                    title: articleTitle,
                    category: articleCategory,
                    savedAt: serverTimestamp()
                });
                showToast('文章收藏成功！', 'success');
                if (btn) btn.className = 'w-10 h-10 rounded-full bg-accent text-primary transition flex items-center justify-center shadow-md';
            }
        } catch (error) {
            console.error("Bookmark error:", error);
            showToast('收藏動作失敗', 'error');
        }
    };

    window.updateBookmarkButtonUI = async (articleId) => {

        const btn = document.getElementById('btn-bookmark');

        try {
            const { doc, getDoc } = window.FS;
            const docSnap = await getDoc(doc(db, "users", user.uid, "bookmarks", articleId));
            if (docSnap.exists()) {
                btn.className = 'w-10 h-10 rounded-full bg-accent text-primary transition flex items-center justify-center shadow-md';
            } else {
                btn.className = 'w-10 h-10 rounded-full bg-secondary hover:bg-white hover:text-primary transition flex items-center justify-center text-white shadow-sm';
            }
        } catch (e) {
            console.log("Failed to check bookmark status", e);
        }
    };

    window.shareArticle = () => {
        const url = window.location.href;
        // 使用臨時 textarea 繞過 iframe 剪貼簿限制
        const textArea = document.createElement("textarea");
        textArea.value = url;
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            showToast('文章連結已複製！', 'success');
        } catch (err) {
            showToast('複製失敗', 'error');
        }
        document.body.removeChild(textArea);
    };

    // --- Admin CMS Logic ---
    window.loadAdminArticles = async () => {
        const tbody = document.getElementById('admin-articles-list');
        if (!tbody) return;

        try {
            const { db } = window.AppState;
            const { collection, getDocs, query, orderBy } = window.FS;
            
            // 管理員看得到所有狀態的文章 (無需過濾 published)
            const q = query(collection(db, "articles"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">目前資料庫中沒有任何文章，請點擊右上角「新增文章」。</td></tr>';
                return;
            }

            let html = '';
            querySnapshot.forEach((doc) => {
                const article = doc.data();
                const dateStr = article.createdAt ? new Date(article.createdAt.seconds * 1000).toISOString().split('T')[0] : '剛建立';
                const statusBadge = article.status === 'published' 
                    ? '<span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-bold">已發布</span>'
                    : '<span class="px-2 py-1 bg-gray-200 text-gray-700 rounded text-xs font-bold">草稿</span>';

                html += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-4 py-4 text-sm text-gray-900 font-bold">${article.title} <br><span class="text-xs text-gray-400 font-normal">${article.category}</span></td>
                        <td class="px-4 py-4 text-sm">${statusBadge}</td>
                        <td class="px-4 py-4 text-sm text-gray-500">${dateStr}</td>
                        <td class="px-4 py-4 text-right text-sm font-medium">
                            <a href="#/article/${doc.id}" target="_blank" class="text-gray-400 hover:text-primary mr-3 transition" title="前台預覽"><i class="fa-solid fa-eye"></i></a>
                            <a href="#/admin/articles/edit/${doc.id}" class="text-cta hover:text-blue-800 transition"><i class="fa-solid fa-pen"></i> 編輯</a>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        } catch (error) {
            console.error(error);
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-red-500">載入失敗：權限不足或連線異常。</td></tr>';
        }
    };

    window.initArticleEditor = async (id) => {
        const form = document.getElementById('article-form');
        if (!form) return;
        
        document.getElementById('article-id').value = id || '';
        document.getElementById('editor-title').innerHTML = id 
            ? '<i class="fa-solid fa-pen-to-square text-accent"></i> 編輯文章' 
            : '<i class="fa-solid fa-plus text-accent"></i> 新增文章';
            
        if (id) {
            try {
                const { db } = window.AppState;
                const { doc, getDoc } = window.FS;
                const docSnap = await getDoc(doc(db, "articles", id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('article-title-input').value = data.title || '';
                    document.getElementById('article-cover-input').value = data.coverImage || '';
                    document.getElementById('article-category-input').value = data.category || 'Vibe Coding';
                    document.getElementById('article-status-input').value = data.status || 'draft';
                    document.getElementById('article-excerpt-input').value = data.excerpt || '';
                    document.getElementById('article-content-input').value = data.content || '';
                }
            } catch(e) {
                showToast("無法載入文章資料", "error");
            }
        }
    };

    window.saveArticle = async (event) => {
        event.preventDefault();
        const btn = document.getElementById('btn-save-article');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...';

        const id = document.getElementById('article-id').value;
        const title = document.getElementById('article-title-input').value;
        const coverImage = document.getElementById('article-cover-input').value;
        const category = document.getElementById('article-category-input').value;
        const status = document.getElementById('article-status-input').value;
        const excerpt = document.getElementById('article-excerpt-input').value;
        const content = document.getElementById('article-content-input').value;

        try {
            const { db, user } = window.AppState;
            const { collection, doc, addDoc, updateDoc, serverTimestamp } = window.FS;

            const articleData = {
                title, coverImage, category, status, excerpt, content,
                visibility: 'public', // 依 PRD 規定預設為公開，由 status 控制
                updatedAt: serverTimestamp(),
                updatedBy: user.uid
            };

            if (id) {
                // 編輯已存在文章
                await updateDoc(doc(db, "articles", id), articleData);
                showToast("文章更新成功！", "success");
            } else {
                // 建立新文章
                articleData.createdAt = serverTimestamp();
                articleData.createdBy = user.uid;
                articleData.authorIds = [user.uid];
                await addDoc(collection(db, "articles"), articleData);
                showToast("新文章建立成功！", "success");
            }
            window.location.hash = '#/admin/articles';
        } catch (error) {
            console.error("Save failed", error);
            showToast("儲存失敗：" + error.message, "error");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 儲存文章';
        }
    };

    // --- Member Dashboard ---
    window.renderMemberDashboard = async () => {
        const { user, db } = window.AppState;
        if (!user) return;
        
        const nameEl = document.getElementById('member-name');
        const emailEl = document.getElementById('member-email');
        const avatarEl = document.getElementById('member-avatar');
        
        if (nameEl) nameEl.innerText = user.displayName || user.email?.split('@')[0] || '會員';
        if (emailEl) emailEl.innerText = user.email || '';
        if (avatarEl) avatarEl.src = user.photoURL || ('https://placehold.co/100x100/163A63/FFF?text=' + (user.displayName || 'M').charAt(0).toUpperCase());
        
        // 從 Firestore 撈取真實收藏清單
        const container = document.getElementById('member-bookmarks-container');
        if (!container) return;
        
        try {
            const { collection, getDocs, query, orderBy } = window.FS;
            const q = query(collection(db, "users", user.uid, "bookmarks"), orderBy("savedAt", "desc"));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center text-textSub bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        <i class="fa-regular fa-folder-open text-3xl mb-3 text-gray-400"></i>
                        <p>目前還沒有收藏任何文章喔！</p>
                        <a href="#/articles" class="inline-block mt-4 px-4 py-2 bg-white border border-gray-200 text-primary text-sm font-medium rounded hover:bg-gray-50 transition shadow-sm">去逛逛專欄文章</a>
                    </div>`;
                return;
            }

            let html = '';
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const dateStr = data.savedAt ? new Date(data.savedAt.seconds * 1000).toISOString().split('T')[0] : '剛剛';
                html += `
                    <div class="bg-white border border-gray-200 rounded-lg p-4 flex justify-between items-start hover:shadow-md transition">
                        <div>
                            <span class="text-xs font-bold text-accent bg-secondary px-2 py-0.5 rounded">${data.category || '未分類'}</span>
                            <h3 class="text-lg font-bold text-primary mt-2 mb-1 line-clamp-2"><a href="#/article/${data.articleId}" class="hover:text-cta transition">${data.title}</a></h3>
                            <p class="text-xs text-gray-400">收藏於：${dateStr}</p>
                        </div>
                        <a href="#/article/${data.articleId}" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-textSub hover:bg-cta hover:text-white transition flex-shrink-0">
                            <i class="fa-solid fa-arrow-right text-sm"></i>
                        </a>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (error) {
            console.error(error);
            container.innerHTML = '<p class="col-span-full text-red-500">載入收藏失敗</p>';
        }
    };

    window.testFirestoreWrite = async () => {
        const logEl = document.getElementById('admin-log');
        if (!logEl) return;
        
        logEl.innerHTML += `\n> 正在發送寫入請求...`;
        
        try {
            const { db, user } = window.AppState;
            const { collection, addDoc, serverTimestamp } = window.FS;
            
            const docRef = await addDoc(collection(db, "articles"), {
                title: "Vibe Coding 自動化測試文章",
                content: "<p>這是一篇測試文章，確認超級管理員寫入權限。</p>",
                status: "published",
                visibility: "public",
                authorIds: [user.uid],
                createdAt: serverTimestamp()
            });
            
            logEl.innerHTML += `\n<span class="text-white">✅ 寫入成功！</span> 文件 ID: ${docRef.id}`;
            showToast("測試文章寫入成功！", "success");
            
        } catch (error) {
            console.error("Firestore write error:", error);
            logEl.innerHTML += `\n<span class="text-red-400">❌ 寫入失敗！</span> 錯誤代碼: ${error.code}`;
            logEl.innerHTML += `\n<span class="text-gray-400">可能原因：Security Rules 阻擋，或您的帳號尚未取得 super_admin 權限。</span>`;
            showToast("寫入失敗，請檢查 Log", "error");
        }
    };

    // --- Ask TONY AI Logic (Gemini + Firestore RAG Simulation) ---
    window.setAskTonyInput = (text) => {
        const input = document.getElementById('ask-tony-input');
        if (input) {
            input.value = text;
            input.focus();
        }
    };

    window.clearChat = () => {
        const chatHistory = document.getElementById('chat-history');
        if (chatHistory) {
            chatHistory.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                    <div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] leading-relaxed shadow-sm">
                        已清除對話紀錄。還有什麼我可以幫忙的嗎？
                    </div>
                </div>
            `;
        }
    };

    window.submitAskTony = async (event) => {
        event.preventDefault();
        const inputEl = document.getElementById('ask-tony-input');
        const btnEl = document.getElementById('ask-tony-btn');
        const chatHistory = document.getElementById('chat-history');
        const query = inputEl.value.trim();
        if (!query) return;

        // 1. 顯示使用者訊息
        const userAvatar = window.AppState.user?.photoURL || 'https://placehold.co/100x100/2563EB/FFF?text=U';
        chatHistory.insertAdjacentHTML('beforeend', `
            <div class="flex gap-4 justify-end">
                <div class="bg-cta p-4 rounded-2xl rounded-tr-none text-white text-sm max-w-[85%] leading-relaxed shadow-sm">
                    ${query}
                </div>
                <img src="${userAvatar}" class="w-8 h-8 rounded-full flex-shrink-0 border border-gray-200">
            </div>
        `);
        
        inputEl.value = '';
        btnEl.disabled = true;
        btnEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        chatHistory.scrollTop = chatHistory.scrollHeight;

        // 2. 顯示 AI 載入中訊息
        const loadingId = 'loading-' + Date.now();
        chatHistory.insertAdjacentHTML('beforeend', `
            <div id="${loadingId}" class="flex gap-4">
                <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                <div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] flex items-center gap-2 shadow-sm border border-transparent animate-pulse">
                    <i class="fa-solid fa-circle-notch fa-spin text-accent"></i> 正在翻閱知識庫文章...
                </div>
            </div>
        `);
        chatHistory.scrollTop = chatHistory.scrollHeight;

        try {
            // 3. RAG 知識庫檢索 (從 Firestore 撈取最近的 3 篇已發布文章作為 Context)
            const { db } = window.AppState;
            const { collection, getDocs, query: fsQuery, where, orderBy, limit } = window.FS;
            
            // 【修正】查詢條件必須與我們稍早建立的「複合索引」完全一致
            const q = fsQuery(
                collection(db, "articles"), 
                where("status", "==", "published"), 
                where("visibility", "==", "public"), 
                orderBy("createdAt", "desc"), 
                limit(3)
            );
            const snap = await getDocs(q);
            
            let contextText = "【以下是從 TONY STUDIO 知識庫檢索到的相關文章內容】：\n\n";
            let hasContext = false;
            
            snap.forEach(doc => {
                const data = doc.data();
                hasContext = true;
                // 清理簡單的 HTML 標籤，保留純文字給 AI 閱讀
                const plainContent = (data.content || '').replace(/<[^>]*>?/gm, ''); 
                contextText += `標題：${data.title}\n摘要：${data.excerpt}\n正文：${plainContent.substring(0, 1000)}...\n\n`;
            });

            if (!hasContext) {
                contextText = "【目前知識庫中尚無任何已發布的文章，請基於你的常識簡短回答，並說明知識庫尚在建置中。】";
            }

            // 4. 準備 Gemini API Payload 與 System Instruction
            const systemPrompt = `你現在是 TONY STUDIO 的專屬 AI 顧問「Ask TONY」。你的語氣要專業、友善，像是一位經驗豐富的全端工程師與架構師。
請嚴格根據以下提供的【知識庫內容】來回答使用者的問題。
如果使用者的問題無法從知識庫內容中找到答案，請誠實地說「根據目前知識庫的資料，我無法精準回答這個問題」，不要自行捏造或臆測。
請盡量使用繁體中文，並且排版要清晰（使用適當的換行或粗體重點）。

${contextText}`;

            const payload = {
                contents: [{ parts: [{ text: query }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };
            
            // 呼叫 Gemini API (Canvas 會自動注入 API Key)
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            
            // 加入 API 錯誤檢查
            if (result.error) {
                throw new Error(result.error.message);
            }

            const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，AI 思考時發生了點狀況。";

            // 簡單的 Markdown 轉 HTML (粗體與換行)
            const formattedHtml = aiText
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-primary">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');

            // 5. 將 AI 回答渲染到畫面上
            document.getElementById(loadingId).outerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-accent font-bold shadow-sm">T</div>
                    <div class="bg-white border border-gray-200 p-4 rounded-2xl rounded-tl-none text-textMain text-sm max-w-[85%] leading-relaxed shadow-sm">
                        ${formattedHtml}
                        <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-[10px] text-gray-400"><i class="fa-solid fa-bolt text-accent"></i> Gemini 驅動</span>
                            <div class="flex gap-3">
                                <button class="text-xs text-gray-400 hover:text-primary transition" title="有幫助" onclick="showToast('感謝您的回饋！', 'success')"><i class="fa-regular fa-thumbs-up text-lg"></i></button>
                                <button class="text-xs text-gray-400 hover:text-red-500 transition" title="無幫助" onclick="showToast('我們會持續改進 AI 模型。', 'info')"><i class="fa-regular fa-thumbs-down text-lg"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        } catch (err) {
            console.error("Ask TONY Error:", err);
            document.getElementById(loadingId).outerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-red-600 flex-shrink-0 flex items-center justify-center text-white font-bold shadow-sm"><i class="fa-solid fa-exclamation"></i></div>
                    <div class="bg-red-50 text-red-700 border border-red-200 p-4 rounded-2xl rounded-tl-none text-sm max-w-[85%] shadow-sm">
                        抱歉，發生錯誤：<br><span class="text-xs font-mono mt-1 block">${err.message || '連線到 AI 伺服器失敗，請稍後再試。'}</span>
                    </div>
                </div>
            `;
        } finally {
            btnEl.disabled = false;
            btnEl.innerHTML = '<i class="fa-regular fa-paper-plane mr-2"></i> 送出';
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    };

    // Initialize Router
    window.addEventListener('hashchange', router);
    window.addEventListener('load', router);

</script>
