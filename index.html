<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, getDoc, doc, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBycn2thYzf2H4YRe21cK7SBZPTWCZG8K4",
        authDomain: "k20-tony-blogger.firebaseapp.com",
        projectId: "k20-tony-blogger",
        storageBucket: "k20-tony-blogger.firebasestorage.app",
        messagingSenderId: "322587779924",
        appId: "1:322587779924:web:e3f3c0704902afa2551ec1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    
    window.AppState = { user: null, role: null, db: db, auth: auth, storage: storage, currentCategory: '全部', searchQuery: '', appId: 'tony-studio' };
    window.FS = { collection, getDocs, getDoc, doc, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, writeBatch };
    window.StorageAPI = { ref, uploadBytes, getDownloadURL };
    window.AuthAPI = { createUserWithEmailAndPassword, signInWithEmailAndPassword };

    window.currentNewsData = []; 
    window.userBookmarksCache = [];

    const initAuth = async () => {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } catch(e) { await signInAnonymously(auth); }
            } else { await signInAnonymously(auth); }
        } catch (error) { console.error("Auth error", error); }
    };
    initAuth();

    // AI API Keys setup
    window.getApiKey = () => {
        const key = localStorage.getItem('tony_gemini_api_key');
        return (key && key.trim() !== '') ? key.trim() : null;
    };
    window.saveApiKey = (key) => {
        if(key && key.trim() !== '') {
            localStorage.setItem('tony_gemini_api_key', key.trim());
            showToast('API 金鑰已儲存於本機', 'success');
        } else { showToast('請提供有效的 API 金鑰', 'warning'); }
    };
    window.showApiKeyModal = () => {
        const existing = document.getElementById('apikey-modal');
        if (existing) existing.remove();
        const currentKey = window.getApiKey() || '';
        const modalHtml = `
            <div id="apikey-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 transition-opacity duration-300 backdrop-blur-sm p-4">
                <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full transform scale-95 transition-transform duration-300 overflow-hidden">
                    <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 class="text-lg font-bold text-primary flex items-center gap-2"><i class="fa-solid fa-key text-accent"></i>設定 AI 系統金鑰</h3>
                        <button onclick="document.getElementById('apikey-modal').remove()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <div class="p-6 text-textMain text-sm leading-relaxed">
                        <p class="mb-4 text-gray-700 font-medium">為啟用智能新聞抓取與 AI 顧問功能，請輸入您的 Google Gemini API 金鑰。</p>
                        <input type="password" id="modal-apikey-input" placeholder="輸入 AIza... 開頭的 39 碼金鑰" value="${currentKey}" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-cta focus:ring-1 focus:ring-cta font-mono text-base transition">
                    </div>
                    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                        <button onclick="document.getElementById('apikey-modal').remove()" class="px-5 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 transition text-sm font-bold">取消</button>
                        <button onclick="const k=document.getElementById('modal-apikey-input').value; if(k){window.saveApiKey(k); document.getElementById('apikey-modal').remove();}else{showToast('請輸入金鑰', 'warning');}" class="px-5 py-2.5 bg-cta hover:bg-blue-700 text-white rounded-lg transition text-sm font-bold shadow-md">儲存並啟用</button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        const modal = document.getElementById('apikey-modal');
        void modal.offsetWidth; 
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
    };

    window.callGeminiAPI = async (systemPrompt, userPrompt, useSearch = false, extraOptions = {}) => {
        const apiKey = window.getApiKey();
        if (!apiKey) { window.showApiKeyModal(); throw new Error("MISSING_API_KEY"); }
        
        // 使用最新的 3.8-flash 模型
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
        
        const payload = {
            contents: [{ role: "user", parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { maxOutputTokens: 8192, ...(extraOptions.generationConfig || {}) }
        };
        if (useSearch) payload.tools = [{ "google_search": {} }];

        try {
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error?.message || `API Error: ${response.status}`);
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
        } catch (error) { throw error; }
    };

    window.updateSEO = (title) => {
        const baseTitle = 'TONY STUDIO';
        document.title = title === '個人品牌官網與專業內容中心' ? `${baseTitle} | ${title}` : (title ? `${title} | ${baseTitle}` : `${baseTitle} | 個人品牌官網與專業內容中心`);
    };

    window.showModal = (title, content, onConfirm = null, confirmText = '確認', isDanger = false) => {
        const existing = document.getElementById('custom-modal');
        if (existing) existing.remove();
        const modalHtml = `
            <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 transition-opacity duration-300 p-4">
                <div class="bg-white rounded-xl shadow-2xl max-w-md w-full transform scale-95 transition-transform duration-300">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                        <h3 class="text-lg font-bold text-primary">${title}</h3>
                        <button onclick="document.getElementById('custom-modal').remove()" class="text-gray-400 hover:text-gray-700"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <div class="p-6 text-textMain text-sm leading-relaxed">${content}</div>
                    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-xl flex justify-end gap-3">
                        <button onclick="document.getElementById('custom-modal').remove()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 transition text-sm font-medium">取消</button>
                        ${onConfirm ? `<button id="modal-confirm-btn" class="px-4 py-2 ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-cta hover:bg-blue-700'} text-white rounded transition text-sm font-medium shadow-sm">${confirmText}</button>` : ''}
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        const modal = document.getElementById('custom-modal');
        void modal.offsetWidth; 
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
        if (onConfirm) document.getElementById('modal-confirm-btn').onclick = () => { onConfirm(); modal.remove(); };
    };

    window.handleLogout = async () => {
        try { 
            await signOut(auth); 
            window.AppState.role = null; 
            showToast("已成功登出", "success"); 
            window.location.hash = '#/'; 
        } 
        catch (error) { console.error("Logout failed", error); }
    };

    window.toggleMobileMenu = () => {
        const menu = document.getElementById('mobile-menu');
        const icon = document.getElementById('mobile-menu-icon');
        if (!menu || !icon) return;
        if (menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-xmark');
        } else {
            menu.classList.add('hidden');
            icon.classList.remove('fa-xmark');
            icon.classList.add('fa-bars');
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user && !user.isAnonymous) {
            try {
                const idTokenResult = await user.getIdTokenResult(true);
                window.AppState.role = idTokenResult.claims.role || 'member';
                if (user.email === 'mindnodeai@gmail.com') window.AppState.role = 'super_admin';
            } catch(e) {
                window.AppState.role = (user.email === 'mindnodeai@gmail.com') ? 'super_admin' : 'member';
            }
            window.AppState.user = user;
        } else { window.AppState.user = null; window.AppState.role = null; }
        updateNavbarAuthUI(window.AppState.user, window.AppState.role);
    });

    function updateNavbarAuthUI(user, role) {
        const authContainer = document.getElementById('nav-auth-container');
        const mobileAuthContainer = document.getElementById('mobile-auth-container');
        if (!authContainer) return;
        if (user) {
            const displayName = user.displayName || user.email?.split('@')[0] || '會員';
            const avatarUrl = user.photoURL || ('https://placehold.co/100x100/163A63/FFF?text=' + displayName.charAt(0).toUpperCase());
            const adminLink = (role === 'super_admin' || role === 'admin') 
                ? `<a href="#/admin" class="text-xs font-bold text-accent bg-secondary px-2 py-1 rounded hover:bg-primary transition"><i class="fa-solid fa-gauge mr-1"></i>管理後台</a>` : '';

            authContainer.innerHTML = `
                <div class="flex items-center space-x-4">
                    ${adminLink}
                    <a href="#/member" class="flex items-center space-x-2 text-textSub hover:text-primary transition bg-gray-50 px-2 py-1.5 rounded-full border border-gray-100">
                        <img src="${avatarUrl}" alt="Avatar" class="w-7 h-7 rounded-full border border-gray-200">
                        <span class="text-sm font-medium hidden sm:block pr-2">${displayName}</span>
                    </a>
                    <button onclick="window.handleLogout()" class="text-sm text-gray-400 hover:text-red-600 transition" title="登出"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            `;
            if (mobileAuthContainer) mobileAuthContainer.innerHTML = `
                <div class="flex items-center space-x-3 px-3 py-3 bg-gray-50 rounded-lg mb-2">
                    <img src="${avatarUrl}" alt="Avatar" class="w-10 h-10 rounded-full border border-gray-200 shadow-sm">
                    <div><p class="text-sm font-bold text-textMain">${displayName}</p>
                    ${(role === 'super_admin' || role === 'admin') ? `<a href="#/admin" onclick="window.toggleMobileMenu()" class="text-xs font-bold text-accent"><i class="fa-solid fa-gauge"></i> 進入管理後台</a>` : ''}</div>
                </div>
                <a href="#/member" onclick="window.toggleMobileMenu()" class="block px-3 py-3 rounded-md text-base font-medium text-textMain hover:bg-gray-50 transition border border-gray-100 mb-2 text-center bg-blue-50 text-cta">進入會員專區</a>
                <button onclick="window.toggleMobileMenu(); window.handleLogout();" class="w-full text-center block px-3 py-3 rounded-md text-base font-medium text-red-600 bg-red-50 hover:bg-red-100 transition shadow-sm">登出帳號</button>
            `;
        } else {
            authContainer.innerHTML = `<a href="#/login" class="px-5 py-2 text-sm font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>`;
            if (mobileAuthContainer) mobileAuthContainer.innerHTML = `<a href="#/login" onclick="window.toggleMobileMenu()" class="block w-full text-center px-5 py-3 text-base font-medium text-white bg-cta rounded-md hover:bg-blue-700 transition shadow-sm">登入 / 註冊</a>`;
        }
    }
</script>

<div id="toast-container" class="fixed bottom-4 left-4 right-4 md:left-auto md:w-96 md:right-4 z-[110] flex flex-col gap-2 pointer-events-none"></div>
<script>
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        let bgColor = 'bg-primary'; let icon = 'fa-info-circle';
        if (type === 'success') { bgColor = 'bg-green-600'; icon = 'fa-check-circle'; }
        else if (type === 'error') { bgColor = 'bg-red-600'; icon = 'fa-exclamation-circle'; }
        else if (type === 'warning') { bgColor = 'bg-accent'; icon = 'fa-exclamation-triangle'; }

        toast.className = `flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white ${bgColor} transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto`;
        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
        setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
    }
</script>

    window.togglePassword = (inputId, iconId) => {
        const input = document.getElementById(inputId);

        if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }

    window.handleEmailLogin = async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submit-btn');
        const originalText = submitBtn.innerText;
        submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';
        try {
            if (window.authMode === 'login') await window.AuthAPI.signInWithEmailAndPassword(window.AppState.auth, email, password);
            else await window.AuthAPI.createUserWithEmailAndPassword(window.AppState.auth, email, password);
            showToast('操作成功！', 'success');
            window.history.back();
            setTimeout(() => { if (window.location.hash === '#/login') window.location.hash = '#/member'; }, 500);
        } catch (error) { showToast('驗證失敗', 'error'); } 
        finally { submitBtn.disabled = false; submitBtn.innerText = originalText; }

    const router = () => {
        const root = document.getElementById('app-root');
        let path = window.location.hash.slice(1) || '/';
        root.classList.remove('page-enter');
        void root.offsetWidth;
        const isEmailAdmin = window.AppState.user && window.AppState.user.email === 'mindnodeai@gmail.com';
        
        if (path === '/' || path === '') { root.innerHTML = Views.home; setTimeout(window.loadHomeData, 100); }
        else if (path === '/articles') { root.innerHTML = Views.articles; setTimeout(async () => { await window.loadCategories('articles-category-filters', 'filters'); window.fetchPublicArticles(); }, 100); }
        else if (path === '/daily-news') { root.innerHTML = Views.dailyNews; setTimeout(window.restoreDailyNews, 50); window.scrollTo(0,0); }
        else if (path.startsWith('/article/')) { const articleId = path.split('/')[2]; root.innerHTML = Views.articleDetail; setTimeout(() => window.fetchArticleDetail(articleId), 100); window.scrollTo(0,0); }
        else if (path === '/ask-tony') { root.innerHTML = Views.askTony; window.scrollTo(0,0); }
        else if (path === '/series') { root.innerHTML = Views.series; setTimeout(window.loadSeriesData, 100); window.scrollTo(0,0); }
        else if (path === '/services' || path === '/courses') { root.innerHTML = Views.services; window.scrollTo(0,0); }
        else if (path === '/contact') { root.innerHTML = Views.contact; window.scrollTo(0,0); }
        else if (path === '/member') { if (!window.AppState.user) return window.location.hash = '#/login'; root.innerHTML = Views.member; setTimeout(window.renderMemberDashboard, 100); window.scrollTo(0,0); }
        else if (path.startsWith('/admin')) {
            if (!window.AppState.user || (!['super_admin', 'admin'].includes(window.AppState.role) && !isEmailAdmin)) return window.location.hash = '#/';
            if (path === '/admin') { root.innerHTML = Views.admin; setTimeout(window.loadAdminDashboard, 100); }
            else if (path === '/admin/articles') { root.innerHTML = Views.adminArticles; setTimeout(window.loadAdminArticles, 100); }
            else if (path === '/admin/articles/new') { root.innerHTML = Views.adminArticleEdit; setTimeout(() => window.initArticleEditor(null), 100); }
            else if (path.startsWith('/admin/articles/edit/')) { const articleId = path.split('/')[4]; root.innerHTML = Views.adminArticleEdit; setTimeout(() => window.initArticleEditor(articleId), 100); }
            else if (path === '/admin/leads') { root.innerHTML = Views.adminLeads; setTimeout(window.loadAdminLeads, 100); }
            else if (path === '/admin/newsletter') { root.innerHTML = Views.adminNewsletter; setTimeout(() => window.initNewsletterEditor(), 100); window.scrollTo(0,0); }
            else if (path === '/admin/settings') { root.innerHTML = Views.adminSettings; setTimeout(() => { window.loadSiteSettings(); }, 100); }
        } else if (path === '/login') { if (window.AppState.user) return window.location.hash = '#/member'; root.innerHTML = Views.login; }
        else { root.innerHTML = `<div class="py-20 text-center"><h2 class="text-2xl font-bold">頁面不存在</h2></div>`; }

        root.classList.add('page-enter');
        if(!path.startsWith('/article/')) window.scrollTo(0,0);
    };

    window.loadHomeData = async () => {
        try {
            const { db } = window.AppState;
            const docSnap = await window.FS.getDoc(window.FS.doc(db, "settings", "global"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.heroTitle) document.getElementById('home-hero-title').innerHTML = data.heroTitle;
                if (data.heroBio) document.getElementById('home-hero-bio').innerHTML = data.heroBio;
                if (data.profileImageUrl) document.getElementById('home-profile-img').src = data.profileImageUrl;
            }
            
            const featuredContainer = document.getElementById('home-featured-articles');
            if (featuredContainer) {
                const q = window.FS.query(window.FS.collection(db, "articles"), window.FS.where("status", "==", "published"), window.FS.where("visibility", "==", "public"), window.FS.orderBy("createdAt", "desc"), window.FS.limit(3));
                const snap = await window.FS.getDocs(q);
                if (snap.empty) { featuredContainer.innerHTML = '<div class="col-span-full py-12 text-center text-textSub">目前尚無文章。</div>'; } 
                else {
                    let html = '';
                    snap.forEach((doc) => {
                        const article = doc.data();
                        const dateStr = article.createdAt ? new Date(article.createdAt.seconds * 1000).toISOString().split('T')[0] : '剛剛';
                        const cover = article.coverImage || 'https://placehold.co/800x400/E2E8F0/64748B?text=TONY+STUDIO';
                        html += `<div class="group bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col"><div class="aspect-video bg-gray-200 cursor-pointer" onclick="window.location.hash='#/article/${doc.id}'"><img src="${cover}" class="w-full h-full object-cover"></div><div class="p-6 flex flex-col flex-grow"><h3 class="text-xl font-bold mb-3 cursor-pointer group-hover:text-cta transition line-clamp-2" onclick="window.location.hash='#/article/${doc.id}'">${article.title}</h3></div></div>`;
                    });
                    featuredContainer.innerHTML = html;
                }
            }
        } catch (error) { console.warn("首頁載入錯誤:", error); }
    };

    window.initArticleEditor = async (id) => {
        const idEl = document.getElementById('article-id');

        if(titleEl) titleEl.innerHTML = id ? '編輯文章' : '新增文章';

        const toolbarOptions = [
            ['bold', 'italic', 'underline', 'strike'], ['blockquote', 'code-block'],
            [{ 'header': 1 }, { 'header': 2 }], [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'color': [] }, { 'background': [] }], [{ 'align': [] }], ['link', 'image', 'video', 'table'], ['clean']
        ];
        window.quillEditor = new Quill('#editor-container', { 
            theme: 'snow', 
            modules: { table: true, toolbar: { container: toolbarOptions, handlers: { image: () => window.quillUploadHandler('image'), video: () => window.quillUploadHandler('video'), table: function() { this.quill.getModule('table').insertTable(3, 3); } } } } 
        });
        
        if (id) {
            const docSnap = await window.FS.getDoc(window.FS.doc(window.AppState.db, "articles", id));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('article-title-input').value = data.title || '';
                document.getElementById('article-excerpt-input').value = data.excerpt || '';

        }

    window.applyNewsletterTemplate = (type) => {
        const templates = {
            'weekly': `<h2>📰 本週精選彙整</h2><p>親愛的讀者，您好：</p><p>本週我們為您挑選了幾篇重點文章：</p><ul><li><strong>文章一</strong>：摘要</li></ul><p>週末愉快！</p>`,

            'event': `<h2>🎉 [活動名稱] 開放報名囉！</h2><ul><li><strong>時間</strong>：</li><li><strong>地點</strong>：</li></ul><p><a href="#">👉 立即報名</a></p>`,
            'insight': `<h2>💡 TONY 的專業洞察</h2><p>這週我觀察到一個現象...</p>`,
            'update': `<h2>👋 近況更新</h2><p>最近發生了一些新變化，想與您分享！</p>`
        };
        if (templates[type] && window.newsletterEditor) {
            window.newsletterEditor.clipboard.dangerouslyPasteHTML(templates[type]);
            showToast('模板已套用', 'success');
        }
    };

    window.sendNewsletter = async (e) => {
        e.preventDefault();
        const subject = document.getElementById('newsletter-subject').value.trim();
        const content = window.newsletterEditor.root.innerHTML;
        if (!subject || !window.newsletterEditor.getText().trim()) return showToast("主旨與內容不能為空", "warning");

        const btn = document.getElementById('btn-send-newsletter');
        const originalHtml = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 發送中...';

        try {
            const snap = await window.FS.getDocs(window.FS.collection(window.AppState.db, "subscribers"));
            let bccList = []; snap.forEach(doc => { if(doc.data().email) bccList.push(doc.data().email); });
            if (bccList.length === 0) { showToast("無訂閱者", "warning"); return; }

            await window.FS.addDoc(window.FS.collection(window.AppState.db, "mail"), { to: "mindnodeai@gmail.com", bcc: bccList, message: { subject, html: content } });
            showToast(`成功觸發！將寄送給 ${bccList.length} 人。`, "success");
            document.getElementById('newsletter-subject').value = ''; window.newsletterEditor.root.innerHTML = '';
        } catch (error) { showToast("發送失敗", "error"); } finally { btn.disabled = false; btn.innerHTML = originalHtml; }
    };

    window.previewImage = async (event, previewId) => {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => { const previewEl = document.getElementById(previewId); if(previewEl) previewEl.src = e.target.result; }
            reader.readAsDataURL(file);
            try {
                showToast("上傳圖片中...", "info");
                const storageRef = window.StorageAPI.ref(window.AppState.storage, `site/${Date.now()}_${file.name}`);
                await window.StorageAPI.uploadBytes(storageRef, file);
                const url = await window.StorageAPI.getDownloadURL(storageRef);
                
                // 判斷是存入哪一個隱藏欄位
                if (previewId === 'settings-header-logo-preview') {
                    document.getElementById('hidden-header-logo').value = url;
                } else if (previewId === 'settings-footer-logo-preview') {
                    document.getElementById('hidden-footer-logo').value = url;
                } else if (previewId === 'settings-preview-img') {
                    document.getElementById('hidden-profile-img').value = url;
                }
                showToast("圖片上傳成功", "success");
            } catch (err) { showToast("上傳失敗", "error"); }
        }
    };

    window.loadSiteSettings = async () => {
        try {
            const docSnap = await window.FS.getDoc(window.FS.doc(window.AppState.db, "settings", "global"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                const setVal = (id, val) => { const el = document.getElementById(id); if(el && val) el.value = val; };
                
                setVal('settings-hero-title', data.heroTitle);
                setVal('settings-hero-bio', data.heroBio);
                
                // 載入 Header Logo
                const headerUrl = data.headerLogoUrl || data.siteLogoUrl;
                if (headerUrl) {
                    const hp = document.getElementById('settings-header-logo-preview'); if(hp) hp.src = headerUrl;
                    setVal('hidden-header-logo', headerUrl);
                }
                // 載入 Footer Logo
                const footerUrl = data.footerLogoUrl || data.siteLogoUrl;
                if (footerUrl) {
                    const fp = document.getElementById('settings-footer-logo-preview'); if(fp) fp.src = footerUrl;
                    setVal('hidden-footer-logo', footerUrl);
                }
                // 載入 Profile Img
                if (data.profileImageUrl) {
                    const pp = document.getElementById('settings-preview-img'); if(pp) pp.src = data.profileImageUrl;
                    setVal('hidden-profile-img', data.profileImageUrl);
                }
            }
        } catch(e) { }
    };

    window.saveSiteSettings = async (e) => {
        e.preventDefault();
        try {
            const getVal = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
            const data = {
                heroTitle: getVal('settings-hero-title'),
                heroBio: getVal('settings-hero-bio'),
                headerLogoUrl: getVal('hidden-header-logo'),
                footerLogoUrl: getVal('hidden-footer-logo'),
                profileImageUrl: getVal('hidden-profile-img'),
                updatedAt: window.FS.serverTimestamp()
            };
            await window.FS.setDoc(window.FS.doc(window.AppState.db, "settings", "global"), data, { merge: true });
            showToast("全域設定已儲存！", "success");
            window.loadGlobalSettings(); // 儲存後立即重新渲染 Logo
        } catch(err) { showToast("儲存失敗", "error"); }
    };

    // 全域網站設定載入器 (確保任何頁面重新整理都會抓 Logo)
    window.loadGlobalSettings = async () => {
        try {
            const docSnap = await window.FS.getDoc(window.FS.doc(window.AppState.db, "settings", "global"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // 更新上方 Header Logo (有新欄位用新欄位，沒有則降級用舊的 siteLogoUrl)
                const headerUrl = data.headerLogoUrl || data.siteLogoUrl;
                if (headerUrl) {
                    const navImg = document.getElementById('nav-logo-img');
                    const navText = document.getElementById('nav-logo-text');
                    if (navImg && navText) { navImg.src = headerUrl; navImg.classList.remove('hidden'); navText.classList.add('hidden'); }
                }

                // 更新下方 Footer Logo (有新欄位用新欄位，沒有則降級用舊的 siteLogoUrl)
                const footerUrl = data.footerLogoUrl || data.siteLogoUrl;
                if (footerUrl) {
                    const footerImg = document.getElementById('footer-logo-img');
                    const footerText = document.getElementById('footer-logo-text');
                    if (footerImg && footerText) { footerImg.src = footerUrl; footerImg.classList.remove('hidden'); footerText.classList.add('hidden'); }
                }
            }
        } catch (error) { console.warn("載入全域設定失敗:", error); }
    };

    window.subscribeNewsletter = async (e) => { /* Subscribe Logic */ };
    window.submitLeadForm = async (e) => { /* Contact Logic */ };

    window.addEventListener('hashchange', router);
    window.addEventListener('load', () => { 
        window.loadGlobalSettings(); 
        router(); 
    });
